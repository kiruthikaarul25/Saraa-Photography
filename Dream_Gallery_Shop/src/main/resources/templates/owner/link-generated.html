<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generated — Saara Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Calibri','Carlito','Segoe UI',sans-serif;background:#ffffff;color:#3a1d2a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
        body::before{content:'';position:fixed;inset:0;background:url('https://images.pexels.com/photos/31580612/pexels-photo-31580612.jpeg?auto=compress&cs=tinysrgb&w=1200') center/cover no-repeat;opacity:0.04;pointer-events:none}

        .wrap{width:100%;max-width:480px;position:relative;z-index:1;text-align:center}

        /* ICON RING */
        .success-ring{width:80px;height:80px;border-radius:50%;border:1px solid rgba(224,53,122,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;background:rgba(224,53,122,0.06);animation:ringPulse 2.5s ease-in-out infinite}
        @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,53,122,0.15)}50%{box-shadow:0 0 0 14px rgba(224,53,122,0)}}
        .success-ring i{color:#e0357a;font-size:2.2rem}

        .eyebrow{font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:#e0357a;margin-bottom:10px}
        .title{font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-size:clamp(1.5rem,4vw,2rem);font-weight:700;letter-spacing:4px;color:#3a1d2a;margin-bottom:8px}
        .title span{color:#e0357a}
        .gold-line{width:50px;height:1px;background:linear-gradient(to right,transparent,#e0357a,transparent);margin:0 auto 16px}
        .subtitle{color:#3a1d2a;font-size:0.85rem;font-weight:700;line-height:1.8;margin-bottom:28px}
        .subtitle strong{color:#e0357a;font-family:'Calibri','Carlito','Segoe UI',sans-serif}

        /* CARD */
        .card{background:#fff5f8;border:1px solid rgba(224,53,122,0.15);border-radius:20px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden;text-align:left}
        .card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(to right,transparent,#e0357a,transparent)}

        .card-label{font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .card-label i{color:#e0357a;font-size:0.85rem}

        /* LINK BOX */
        .link-box{background:#ffffff;border:1px solid rgba(224,53,122,0.12);border-radius:12px;padding:14px 16px;font-size:0.78rem;word-break:break-all;color:#3a1d2a;font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-weight:700;line-height:1.6;margin-bottom:14px;transition:border-color 0.3s}
        .link-box:hover{border-color:rgba(224,53,122,0.25)}

        /* COPY BTN */
        .btn-copy{width:100%;padding:11px;background:transparent;border:1px solid rgba(224,53,122,0.25);color:#e0357a;border-radius:40px;cursor:pointer;font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.3s}
        .btn-copy:hover{background:rgba(224,53,122,0.08);border-color:rgba(224,53,122,0.5)}
        .btn-copy i{font-size:0.95rem}
        .btn-copy.copied{color:#4caf50;border-color:rgba(76,175,80,0.4)}

        /* ACTION BUTTONS */
        .actions{display:flex;flex-direction:column;gap:12px}
        .btn-wa{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;background:rgba(37,211,102,0.08);border:1px solid rgba(37,211,102,0.25);color:#25D366;border-radius:40px;text-decoration:none;font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s}
        .btn-wa:hover{background:rgba(37,211,102,0.15);border-color:rgba(37,211,102,0.5)}
        .btn-wa i{font-size:1.1rem}
        .btn-back{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;background:transparent;border:1px solid rgba(224,53,122,0.25);color:#3a1d2a;border-radius:40px;text-decoration:none;font-family:'Calibri','Carlito','Segoe UI',sans-serif;font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s}
        .btn-back:hover{color:#e0357a;border-color:rgba(224,53,122,0.5)}
        .btn-back i{font-size:0.95rem}

        /* Allow scrolling on short/landscape phones so nothing clips */
        @media (max-height: 600px) {
            body { align-items: flex-start; overflow: auto; padding-top: 28px; }
        }

        @media (max-width: 360px) {
            .card { padding: 20px 16px; }
            .success-ring { width: 64px; height: 64px; margin-bottom: 20px; }
            .success-ring i { font-size: 1.8rem; }
        }
    </style>
<link rel="stylesheet" href="/css/site-nav.css">
<style id="saara-theme">body{font-weight:700}button,input,select,textarea{font-family:inherit;font-weight:700}.bottom-nav{background:rgba(255,255,255,.95)!important;border-top:1px solid rgba(224,53,122,.25)!important}.bottom-nav ul li a{color:#3a1d2a!important;font-family:inherit!important;font-weight:700}.bottom-nav ul li a:hover,.bottom-nav ul li a.active{color:#e0357a!important}</style>
</head>
<body>

<div class="wrap">

    <div class="success-ring"><i class="ti ti-link"></i></div>

    <p class="eyebrow">Saara Photography</p>
    <h1 class="title">Link <span>Generated!</span></h1>
    <div class="gold-line"></div>
    <p class="subtitle">
        Share this link with <strong th:text="${client.coupleName}">Couple Name</strong>
    </p>

    <!-- LINK CARD -->
    <div class="card">
        <p class="card-label"><i class="ti ti-link"></i>Gallery Link</p>
        <div class="link-box" id="theLink" th:text="${link}">https://example.com/gallery/abc123</div>
        <button class="btn-copy" onclick="copyLink()" id="copyBtn">
            <i class="ti ti-copy" id="copyIcon"></i>
            <span id="copyText">Copy Link</span>
        </button>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
        <a th:href="${'https://wa.me/' + client.phone + '?text=Hi+' + client.coupleName + '+Your+photos+are+ready:+' + link}"
           target="_blank" class="btn-wa">
            <i class="ti ti-brand-whatsapp"></i>Send via WhatsApp
        </a>
        <a th:href="@{/clients}" class="btn-back">
            <i class="ti ti-arrow-left"></i>Back to Clients
        </a>
    </div>

</div>

<script>
function copyLink() {
    const text = document.getElementById('theLink').textContent.trim();
    const btn = document.getElementById('copyBtn');
    const icon = document.getElementById('copyIcon');
    const label = document.getElementById('copyText');
    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        icon.className = 'ti ti-circle-check';
        label.textContent = 'Copied!';
        setTimeout(() => {
            btn.classList.remove('copied');
            icon.className = 'ti ti-copy';
            label.textContent = 'Copy Link';
        }, 2500);
    });
}
</script>


<nav class="bottom-nav">
    <ul>
        <li><a href="/"><i class="ti ti-home"></i><span>Home</span></a></li>
        <li><a href="/work"><i class="ti ti-video"></i><span>Work</span></a></li>
        <li><a href="/select"><i class="ti ti-photo"></i><span>Select</span></a></li>
        <li><a href="/packages-page"><i class="ti ti-diamond"></i><span>Packages</span></a></li>
        <li><a href="/contact"><i class="ti ti-phone"></i><span>Contact</span></a></li>
    </ul>
</nav>

<script src="/js/constants.js"></script>
</body>
</html>
