<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Saara Photography</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Calibri','Carlito','Segoe UI',sans-serif; font-weight: 700; background: #fff; color: #000; overflow-x: hidden; }
    button { font-family: inherit; font-weight: 700; }

    .fixed-social { position: fixed; bottom: 90px; right: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 300; }
    .fixed-social a { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; text-decoration: none; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: transform .25s; }
    .fixed-social a:hover { transform: scale(1.1); }
    .fixed-social .ig { background: #d4146a; } .fixed-social .wa { background: #000; }

    /* HERO */
    .hero { text-align: center; padding: 48px 20px 10px; }
    .hero img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #d4146a; box-shadow: 0 6px 20px rgba(212,20,106,.45); margin-bottom: 14px; }
    .hero-tag { display: block; font-size: 11px; letter-spacing: 6px; color: #d4146a; text-transform: uppercase; margin-bottom: 10px; }
    .hero h1 { font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: 2px; }
    .hero h1 span { color: #d4146a; }
    .line { width: 50px; height: 3px; background: #d4146a; margin: 14px auto 0; }

    /* ADMIN BAR */
    .admin-bar { display: none; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: #000; color: #fff; padding: 12px 16px; margin: 24px auto 0; max-width: 1000px; border-radius: 12px; font-size: .9rem; }
    .admin-bar button, .admin-bar label.btn { background: #d4146a; color: #fff; border: 0; padding: 9px 20px; border-radius: 999px; cursor: pointer; font-size: .85rem; }
    .admin-bar button.ghost { background: transparent; border: 2px solid #fff; }
    .admin-bar input[type=file] { display: none; }
    #status { font-size: .8rem; }

    /* GALLERY */
    .gallery { max-width: 1000px; margin: 0 auto; padding: 30px 14px 20px; column-count: 3; column-gap: 12px; }
    @media (max-width: 820px) { .gallery { column-count: 2; } }
    .photo { break-inside: avoid; margin-bottom: 12px; position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #000; cursor: zoom-in; transition: border-color .3s, transform .3s; }
    .photo:hover { border-color: #d4146a; transform: translateY(-3px); }
    .photo img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
    .photo .del { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #d4146a; color: #fff; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; }
    body.admin .photo .del { display: flex; }
    .empty { text-align: center; padding: 50px 20px; column-span: all; }
    .empty i { font-size: 40px; color: #d4146a; display: block; margin-bottom: 10px; }

    /* LIGHTBOX */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 600; padding: 16px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 92vh; border-radius: 10px; border: 3px solid #d4146a; }
    .lightbox button { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #d4146a; color: #fff; font-size: 22px; cursor: pointer; }

    /* ABOUT */
    .about { background: #000; color: #fff; text-align: center; padding: 56px 22px; margin-top: 30px; }
    .about .eyebrow { font-size: 11px; letter-spacing: 6px; color: #d4146a; text-transform: uppercase; margin-bottom: 8px; }
    .about h2 { font-size: 2rem; margin-bottom: 14px; }
    .about p { max-width: 560px; margin: 0 auto 10px; line-height: 1.6; }
    .about a { display: inline-block; margin-top: 16px; background: #d4146a; color: #fff; text-decoration: none; padding: 12px 34px; border-radius: 999px; }

    /* NAV */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(255,255,255,.96); backdrop-filter: blur(20px); border-top: 2px solid #d4146a; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
    .bottom-nav ul { display: flex; justify-content: space-around; list-style: none; max-width: 500px; margin: 0 auto; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #000; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 8px; transition: color .3s; }
    .bottom-nav a i { font-size: 20px; }
    .bottom-nav a:hover, .bottom-nav a.active { color: #d4146a; }
    .spacer { height: 80px; }
  </style>
</head>
<body>

<div class="fixed-social">
  <a class="ig" href="https://www.instagram.com/saaraphotography05" target="_blank" aria-label="Instagram"><i class="ti ti-brand-instagram"></i></a>
  <a class="wa" href="https://wa.me/919786711698?text=Hi!%20I'm%20interested%20in%20your%20photography%20services." target="_blank" aria-label="WhatsApp"><i class="ti ti-brand-whatsapp"></i></a>
</div>

<div class="hero">
  <img src="/images/logo.png" alt="Saara Photography logo">
  <span class="hero-tag">Saara Photography</span>
  <h1>Our <span>Work</span></h1>
  <div class="line"></div>
</div>

<div class="admin-bar" id="adminBar">
  <span><i class="ti ti-shield-lock"></i> Admin mode</span>
  <label class="btn"><i class="ti ti-photo-plus"></i> Add photos
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>
  <button class="ghost" onclick="setAdmin(false)">Logout</button>
  <span id="status"></span>
</div>

<div class="gallery" id="gallery"></div>

<div class="about">
  <p class="eyebrow">Who We Are</p>
  <h2>Saara Photography</h2>
  <p>Destination photographers for all kind of events. Our team travels service wide to tell your story the way it deserves to be told.</p>
  <a href="/contact">Book your date</a>
</div>

<div class="lightbox" id="lightbox"><button onclick="closeLb()" aria-label="Close">&times;</button><img id="lbImg" alt=""></div>

<div class="spacer"></div>

<nav class="bottom-nav">
  <ul>
    <li><a href="/"><i class="ti ti-home"></i><span>Home</span></a></li>
    <li><a href="/work" class="active"><i class="ti ti-movie"></i><span>Work</span></a></li>
    <li><a href="/select"><i class="ti ti-photo"></i><span>Select</span></a></li>
    <li><a href="/packages-page"><i class="ti ti-diamond"></i><span>Packages</span></a></li>
    <li><a href="/contact"><i class="ti ti-phone"></i><span>Contact</span></a></li>
  </ul>
</nav>

<script>
  /* ── STORAGE: IndexedDB (backend step-la idhai maathuvom) ── */
  function openDB() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('saara', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function tx(mode, fn) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const q = fn(t.objectStore('photos'));
      t.oncomplete = () => res(q && q.result);
      t.onerror = () => rej(t.error);
    });
  }
  const dbAll = () => tx('readonly', s => s.getAll());
  const dbPut = o => tx('readwrite', s => s.put(o));
  const dbDel = id => tx('readwrite', s => s.delete(id));

  const ADMIN_KEY = 'saara_admin';
  const isAdmin = () => localStorage.getItem(ADMIN_KEY) === '1';
  function setAdmin(on) { localStorage.setItem(ADMIN_KEY, on ? '1' : '0'); applyAdmin(); }
  function applyAdmin() {
    document.body.classList.toggle('admin', isAdmin());
    document.getElementById('adminBar').style.display = isAdmin() ? 'flex' : 'none';
  }

  /* ── RENDER ── */
  let urls = [];
  async function render() {
    urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
    let list = [];
    try { list = await dbAll(); } catch (e) {}
    list.sort((a, b) => b.added - a.added);
    const g = document.getElementById('gallery');
    if (!list.length) {
      g.innerHTML = '<div class="empty"><i class="ti ti-photo"></i>' +
        (isAdmin() ? 'Add photos button click panni photos upload pannunga.' : 'Photos coming soon.') + '</div>';
      return;
    }
    g.innerHTML = '';
    list.forEach(p => {
      const url = URL.createObjectURL(p.blob); urls.push(url);
      const d = document.createElement('div');
      d.className = 'photo';
      d.innerHTML = '<img alt="Saara Photography" draggable="false"><button class="del" aria-label="Delete"><i class="ti ti-trash"></i></button>';
      d.querySelector('img').src = url;
      d.addEventListener('click', e => { if (!e.target.closest('.del')) openLb(url); });
      d.querySelector('.del').addEventListener('click', async () => {
        if (!confirm('Indha photo-va delete pannanuma?')) return;
        await dbDel(p.id); render();
      });
      g.appendChild(d);
    });
  }

  /* ── UPLOAD (resize panni save) ── */
  function compress(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => res(b), 'image/jpeg', 0.82);
      };
      img.onerror = () => rej(new Error('bad image'));
      img.src = url;
    });
  }
  document.getElementById('fileInput').addEventListener('change', async e => {
    const files = [...e.target.files];
    const st = document.getElementById('status');
    let done = 0;
    for (const f of files) {
      st.textContent = 'Uploading ' + (done + 1) + '/' + files.length + '…';
      try { await dbPut({ id: Date.now() + done, blob: await compress(f), added: Date.now() + done }); } catch (err) {}
      done++;
    }
    st.textContent = done + ' photo(s) added ✓';
    e.target.value = '';
    render();
  });

  /* ── LIGHTBOX ── */
  function openLb(u) { document.getElementById('lbImg').src = u; document.getElementById('lightbox').classList.add('open'); }
  function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  /* TEST ONLY: Ctrl+Shift+A = admin mode on/off */
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); setAdmin(!isAdmin()); render(); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  applyAdmin();
  render();
</script>
</body>
</html>
