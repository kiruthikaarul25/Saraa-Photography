<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login — Saara Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            background: #ffffff;
            color:#3a1d2a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* subtle bg */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: url('https://images.pexels.com/photos/30458525/pexels-photo-30458525.jpeg?auto=compress&cs=tinysrgb&w=1200') center/cover no-repeat;
            opacity: 0.04;
            pointer-events: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            position: relative; z-index: 1;
        }

        /* BRAND */
        .brand {
            text-align: center;
            margin-bottom: 36px;
        }
        .brand-dots {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 16px;
        }
        .brand-dots span {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(224,53,122,0.4);
        }
        .brand-dots span:nth-child(2) { background: #e0357a; }
        .brand h1 {
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            font-size: clamp(1.6rem, 5vw, 2rem);
            font-weight:700; color:#3a1d2a; letter-spacing: 6px;
        }
        .brand h1 span { color: #e0357a; }
        .brand p {
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            color:#3a1d2a; font-size: 0.68rem;
            letter-spacing: 5px; text-transform: uppercase; margin-top: 6px;
        }

        /* CARD */
        .card {
            background: #fff5f8;
            border: 1px solid rgba(224,53,122,0.18);
            border-radius: 22px;
            padding: 40px 36px;
            position: relative; overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(to right, transparent, #e0357a, transparent);
        }
        @media(max-width:480px) { .card { padding: 30px 22px; } }

        .card-eyebrow {
            font-size: 0.65rem; letter-spacing: 4px;
            text-transform: uppercase; color: #e0357a;
            margin-bottom: 8px;
        }
        .card h2 {
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            font-size: 1.5rem; font-weight:700;
            color:#3a1d2a; letter-spacing: 3px; margin-bottom: 6px;
        }
        .card .subtitle {
            color:#3a1d2a; font-size: 0.8rem;
            font-weight:700; margin-bottom: 32px; line-height: 1.6;
        }

        /* ERROR */
        .error-msg {
            display: flex; align-items: center; gap: 10px;
            background: rgba(231,76,60,0.07);
            border: 1px solid rgba(231,76,60,0.25);
            border-radius: 12px; padding: 12px 16px;
            color: #e74c3c; font-size: 0.8rem;
            margin-bottom: 22px; line-height: 1.5;
        }
        .error-msg i { font-size: 1.1rem; flex-shrink: 0; }

        /* FIELDS */
        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 0.68rem;
            letter-spacing: 2px; text-transform: uppercase;
            color:#3a1d2a; margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color:#3a1d2a; font-size: 1rem; pointer-events: none;
            transition: color 0.3s;
        }
        .field input {
            width: 100%;
            background: #ffffff;
            border: 1px solid rgba(224,53,122,0.15);
            border-radius: 12px;
            padding: 13px 16px 13px 42px;
            color:#3a1d2a;
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            font-size: 0.88rem; font-weight:700;
            outline: none;
            transition: border-color 0.3s;
        }
        .field input::placeholder { color: #333; }
        .field input:focus { border-color: rgba(224,53,122,0.5); }
        .field input:focus + i,
        .input-wrap:focus-within i { color: #e0357a; }

        /* LOGIN BTN */
        .btn-login {
            width: 100%; margin-top: 10px;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(224,53,122,0.5);
            color: #e0357a; border-radius: 40px;
            font-family: 'Calibri','Carlito','Segoe UI',sans-serif;
            font-size: 0.75rem; letter-spacing: 3px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.35s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover {
            background: #e0357a; color:#fff;
            border-color: #e0357a;
        }
        .btn-login i { font-size: 1rem; }

        /* BACK LINK */
        .back-link {
            text-align: center; margin-top: 24px;
        }
        .back-link a {
            color: #333; text-decoration: none;
            font-size: 0.75rem; letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 6px;
            transition: color 0.3s;
        }
        .back-link a:hover { color: #e0357a; }
        .back-link a i { font-size: 0.9rem; }

        /* gold divider */
        .gold-line {
            width: 40px; height: 1px;
            background: linear-gradient(to right, transparent, #e0357a, transparent);
            margin: 0 auto 28px;
        }

        /* Short / landscape phones: allow natural scrolling instead of squeezing the form */
        @media (max-height: 600px) {
            body { align-items: flex-start; padding-top: 32px; overflow: auto; }
        }

        @media (max-width: 360px) {
            .card { padding: 26px 18px; border-radius: 18px; }
            .brand { margin-bottom: 28px; }
        }
    </style>
<link rel="stylesheet" href="/css/site-nav.css">
<style id="saara-theme">body{font-weight:700}button,input,select,textarea{font-family:inherit;font-weight:700}.bottom-nav{background:rgba(255,255,255,.95)!important;border-top:1px solid rgba(224,53,122,.25)!important}.bottom-nav ul li a{color:#3a1d2a!important;font-family:inherit!important;font-weight:700}.bottom-nav ul li a:hover,.bottom-nav ul li a.active{color:#e0357a!important}</style>
</head>
<body>

<div class="login-wrap">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-dots">
            <span></span><span></span><span></span>
        </div>
        <h1>Saara <span>Photography</span></h1>
        <p>Photography &amp; Cinematography</p>
    </div>

    <!-- CARD -->
    <div class="card">
        <p class="card-eyebrow">Client Portal</p>
        <h2>Welcome Back</h2>
        <p class="subtitle" th:text="${coupleName != null} ? 'Welcome, ' + ${coupleName} + '. Enter your credentials below.' : 'Enter your credentials to view your gallery.'">
            Enter your credentials to view your gallery.
        </p>

        <div class="gold-line"></div>

        <!-- Error -->
        <div class="error-msg" th:if="${error}">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${error}">Invalid credentials.</span>
        </div>

        <!-- Token-based login -->
        <form th:if="${token != null}" th:action="@{/gallery/login}" method="post">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="field">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" th:value="${token}" required/>
                    <i class="ti ti-user"></i>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" placeholder="Enter your password" required/>
                    <i class="ti ti-lock"></i>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="ti ti-photo"></i> View My Gallery
            </button>
        </form>

        <!-- Direct login -->
        <form th:if="${token == null}" th:action="@{/client/login}" method="post">
            <div class="field">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" placeholder="Enter your username" required/>
                    <i class="ti ti-user"></i>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" placeholder="Enter your password" required/>
                    <i class="ti ti-lock"></i>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="ti ti-photo"></i> View My Gallery
            </button>
        </form>
    </div>

    <!-- BACK -->
    <div class="back-link">
        <a href="/select"><i class="ti ti-arrow-left"></i> Back to Select</a>
    </div>

</div>



<nav class="bottom-nav">
    <ul>
        <li><a href="/"><i class="ti ti-home"></i><span>Home</span></a></li>
        <li><a href="/work"><i class="ti ti-video"></i><span>Work</span></a></li>
        <li><a href="/select"><i class="ti ti-photo"></i><span>Select</span></a></li>
        <li><a href="/packages-page"><i class="ti ti-diamond"></i><span>Packages</span></a></li>
        <li><a href="/contact"><i class="ti ti-phone"></i><span>Contact</span></a></li>
    </ul>
</nav>

<script src="/js/constants.js"></script>
</body>
</html>
