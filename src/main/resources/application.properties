# ==========================================
# APPLICATION NAME
# ==========================================
spring.application.name=Dream_Gallery_Shop

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8765}

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dream_gallery_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:nk3125}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# THYMELEAF CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-swallow-size=-1

# Long ZIP downloads must not time out
spring.mvc.async.request-timeout=-1

# ==========================================
# PHOTO UPLOAD DIRECTORY
# ==========================================
app.upload.dir=${UPLOAD_DIR:uploads/photos}

# ==========================================
# STATIC RESOURCES
# ==========================================
spring.web.resources.static-locations=classpath:/static/,file:./

# ==========================================
# SESSION CONFIGURATION
# ==========================================
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=43200

# ==========================================
# SMS OTP - FAST2SMS
# ==========================================
app.sms.api-key=${FAST2SMS_API_KEY:}

# Admin approval phone number
app.admin.approval-phone=9363594725

# ==========================================
# SERVER ERROR CONFIGURATION
# ==========================================
server.error.include-message=never
server.error.include-stacktrace=never

# ==========================================
# SERVER COMPRESSION
# ==========================================
server.compression.enabled=false

# ===================================
# GMAIL NOTIFICATION
# ===================================
# Mail sending (Brevo SMTP - no Gmail password needed)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# "From" address shown in the mail (must be a sender verified in Brevo)
app.mail.from=${MAIL_FROM:kiruthikaarul25@gmail.com}

# Owner Approval Email
app.notification.owner-email=kiruthikaarul25@gmail.com

# Application URL
app.base-url=${APP_BASE_URL:http://localhost:8765}