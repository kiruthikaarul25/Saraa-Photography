# ===================================
# APP NAME
# ===================================
spring.application.name=Dream_Gallery_Shop

# ===================================
# SERVER PORT
# ===================================
server.port=${PORT:8765}

# ===================================
# DATABASE - MySQL
# ===================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dream_gallery_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:nk3125}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================
# THYMELEAF
# ===================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===================================
# FILE UPLOAD
# ===================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1
server.compression.enabled=false
# long ZIP downloads must not time out
spring.mvc.async.request-timeout=-1
# ===================================
# UPLOAD DIRECTORY
# ===================================
app.upload.dir=${UPLOAD_DIR:uploads/photos}

# ===================================
# STATIC RESOURCES
# ===================================
spring.web.resources.static-locations=classpath:/static/,file:./

# ===================================
# SESSION — stay logged in (admin + client) until browser/tab closed
# ===================================
server.servlet.session.timeout=12h
server.servlet.session.cookie.max-age=43200

# ===================================
# MAIL (OTP) - Gmail App Password
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000