spring.application.name=Dream_Gallery_Shop

server.port=${PORT:8765}
# Needed behind Railway/any proxy so client IP and https are detected correctly
server.forward-headers-strategy=native

# ==========================================
# DATABASE  (no password default - set MYSQLPASSWORD in your environment)
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/dream_gallery_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache ON by default. For local template editing: THYMELEAF_CACHE=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-swallow-size=-1
spring.mvc.async.request-timeout=-1

app.upload.dir=${UPLOAD_DIR:uploads/photos}

# Only classpath static files here. ./uploads is exposed by StaticResourceConfig
# (the old "file:./" served the whole project folder, including this file).
spring.web.resources.static-locations=classpath:/static/

server.servlet.session.timeout=12h
server.servlet.session.persistent=true
server.servlet.session.store-dir=${SESSION_DIR:./sessions}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# SMS is no longer used. Kept empty so any @Value that still reads these does not fail.
app.sms.api-key=${FAST2SMS_API_KEY:}
app.admin.approval-phone=${ADMIN_APPROVAL_PHONE:}

server.error.include-message=never
server.error.include-stacktrace=never

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Mail (Brevo SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:}
app.notification.owner-email=${OWNER_NOTIFICATION_EMAIL:}

app.base-url=${APP_BASE_URL:http://localhost:8765}