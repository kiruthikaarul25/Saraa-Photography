<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client — Saara Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
:root{color-scheme:dark}
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            background:#c2185b; color:#ffffff;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px; min-height: 100vh;
            background:#c2185b;
            border-right: 1px solid rgba(233,30,99,0.1);
            padding: 28px 16px;
            position: fixed; top: 0; left: 0; bottom: 0;
            display: flex; flex-direction: column;
            z-index: 50;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 0 8px 28px;
            border-bottom: 1px solid rgba(233,30,99,0.1);
            margin-bottom: 20px;
        }
        .sidebar-brand h2 {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 1rem; font-weight:700;
            letter-spacing: 3px; color: #e91e63;
            white-space: nowrap;
        }
        .sidebar-brand p {
            font-size: 0.6rem; letter-spacing: 3px;
            text-transform: uppercase; color:#f2b8d2; margin-top: 3px;
            white-space: nowrap;
        }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            color:#ffffff; text-decoration: none;
            font-size: 0.78rem; letter-spacing: 1.5px;
            text-transform: uppercase; margin-bottom: 4px;
            transition: all 0.25s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .nav-item i { font-size: 1.05rem; flex-shrink: 0; }
        .nav-item:hover { color: #e91e63; background: rgba(233,30,99,0.05); border-color: rgba(233,30,99,0.1); }
        .nav-item.active { color: #e91e63; background: rgba(233,30,99,0.08); border-color: rgba(233,30,99,0.15); }
        .nav-item.danger { color:#ffffff; }
        .nav-item.danger:hover { color: #e74c3c; background: rgba(231,76,60,0.05); border-color: rgba(231,76,60,0.1); }

        .sidebar-spacer { flex: 1; }

        /* mobile sidebar toggle */
        .mob-header {
            display: none;
            position: sticky; top: 0; z-index: 40;
            background: rgba(17,17,17,.95); backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(233,30,99,0.1);
            padding: 14px 18px;
            align-items: center; justify-content: flex-start;
            gap: 14px;
        }
        .mob-header h2 {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif; font-size: 0.9rem;
            font-weight:700; letter-spacing: 3px; color: #e91e63;
            white-space: nowrap;
        }
        .mob-menu-btn {
            background: none; border: 1px solid rgba(233,30,99,0.2);
            border-radius: 8px; color: #e91e63;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* overlay shown behind the sidebar on mobile when it's open,
           so the page content underneath doesn't shift/overlap weirdly */
        .sidebar-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 45;
        }
        .sidebar-overlay.show { display: block; }

        @media(max-width:768px) {
            .sidebar {
                width: 240px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .mob-header { display: flex; }
            .main { margin-left: 0 !important; }
            body.sidebar-locked { overflow: hidden; }
        }

        /* ── MAIN ── */
        .main {
            margin-left: 220px; flex: 1;
            padding: 36px 28px; min-height: 100vh;
            width: 100%;
            min-width: 0;
        }
        @media(max-width:900px) { .main { padding: 24px 16px; } }

        /* PAGE HEADER */
        .page-top {
            display: flex; align-items: center; gap: 14px; margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 30px;
            border: 1px solid rgba(233,30,99,0.2);
            color:#ffffff; text-decoration: none;
            font-size: 0.72rem; letter-spacing: 1.5px;
            text-transform: uppercase; transition: all 0.25s;
            white-space: nowrap;
        }
        .back-btn:hover { color: #e91e63; border-color: rgba(233,30,99,0.4); }
        .back-btn i { font-size: 0.9rem; }

        .page-top h4 {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 1.2rem; font-weight:700;
            letter-spacing: 3px; color:#ffffff;
        }
        @media(max-width:480px) {
            .page-top h4 { font-size: 1rem; letter-spacing: 2px; }
        }

        /* FORM CARD */
        .form-card {
            background:#111111;
            border: 1px solid rgba(233,30,99,0.15);
            border-radius: 20px; padding: 36px 32px;
            max-width: 540px; position: relative; overflow: hidden;
        }
        .form-card::before {
            content: '';
            position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
            background: linear-gradient(to right, transparent, #e91e63, transparent);
        }
        @media(max-width:600px) { .form-card { padding: 26px 18px; } }

        /* FIELDS */
        .field { margin-bottom: 20px; }
        .field label {
            display: block; font-size: 0.68rem;
            letter-spacing: 2px; text-transform: uppercase;
            color:#ffffff; margin-bottom: 8px;
        }
        .field label span { color: #e91e63; margin-left: 2px; }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 13px; top: 50%;
            transform: translateY(-50%);
            color:#f2b8d2; font-size: 1rem; pointer-events: none;
            transition: color 0.3s;
        }
        .input-wrap:focus-within i { color: #e91e63; }
        .field input {
            width: 100%;
            background:#c2185b;
            border: 1px solid rgba(233,30,99,0.12);
            border-radius: 12px;
            padding: 13px 16px 13px 42px;
            color:#ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 0.88rem; font-weight:700;
            outline: none; transition: border-color 0.3s;
        }
        .field input::placeholder { color:#d79ab7; }
        .field input:focus { border-color: rgba(233,30,99,0.45); }
        .field-hint {
            font-size: 0.7rem; color: #383838;
            margin-top: 6px; letter-spacing: 0.5px; line-height: 1.5;
        }

        /* SECTION DIVIDER */
        .section-sep {
            display: flex; align-items: center; gap: 12px;
            margin: 28px 0 22px;
        }
        .section-sep .sep-line {
            flex: 1; height: 1px;
            background: rgba(233,30,99,0.1);
        }
        .section-sep .sep-label {
            display: flex; align-items: center; gap: 7px;
            font-size: 0.65rem; letter-spacing: 3px;
            text-transform: uppercase; color: #e91e63;
            white-space: nowrap;
        }
        .section-sep .sep-label i { font-size: 0.9rem; }

        /* SUBMIT */
        .btn-submit {
            width: 100%; margin-top: 8px;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(233,30,99,0.45);
            color: #e91e63; border-radius: 40px; cursor: pointer;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 0.78rem; letter-spacing: 3px;
            text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.35s;
        }
        .btn-submit:hover { background: #e91e63; color:#fff; border-color: #e91e63; }
        .btn-submit i { font-size: 1rem; }

        /* Very small phones: a touch tighter still */
        @media (max-width: 360px) {
            .main { padding: 18px 12px; }
            .form-card { padding: 20px 14px; border-radius: 16px; }
            .field { margin-bottom: 16px; }
        }
    </style>

<style id="pink-theme">
/* ===== Medium dark pink + white + black theme ===== */

html,body{font-family:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif !important}
button,input,select,textarea{font-family:inherit !important}
.card,.form-card,.pkg-card,.photo-card,.action-card,.mob-client-card,.insta-item,.photo-item,.preview-item,.album-header,.drop-zone,.item{box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sidebar{box-shadow:4px 0 18px rgba(0,0,0,.35)}
.bottom-nav{box-shadow:0 -4px 16px rgba(0,0,0,.3)}
button,.btn-save,.btn-add,.btn-copy,.btn-back,.back-btn,.submit,.logout-btn,.sidebar-logout{box-shadow:0 4px 12px rgba(0,0,0,.3)}
input,select,textarea{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.btn-back,.back-btn{background:var(--black) !important;color:#fff !important;border:1px solid var(--black) !important}
.btn-back:hover,.back-btn:hover{background:var(--pink-main) !important;border-color:var(--pink-main) !important}
.section-sep{border-color:var(--black) !important}
.card,.form-card,.pkg-card,.photo-card,.action-card{border-top:4px solid var(--black)}

/* dark pages: pink background, black cards, white headings */
.main h1,.main h1 span,.page-title,.page-title span,.main>.section-label,.main>.page-top *,.page-header *,.main>h2,.main>p{color:#fff !important}
.main .section-label,.main .section-title{color:#fff !important}
.sidebar{background:#111111 !important;border-right:3px solid var(--pink-main)}
.album-header{background:#111111 !important}
.album-header *{color:#fff !important}
.album-header .badge,.album-header [class*=count]{color:#fff !important}
</style>

<style id="pink-white-theme-overrides">
:root { color-scheme: light !important; --theme-pink:#d95791; --theme-pink-dark:#c94480; --theme-pink-light:#f7dce8; --theme-white:#ffffff; --theme-black:#171317; --theme-muted:#6f6269; --theme-border:#efd0dd; }
html { color-scheme: light !important; }
body { background:#fff !important; color:var(--theme-black) !important; }
body::before { opacity:.025 !important; }
header, nav, aside, .sidebar, .topbar, .navbar, .header, .side-nav, .mobile-nav {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:var(--theme-border) !important;
}
main, .main, .content, .main-content, .page-content, .workspace, .container, .wrap {
  color:var(--theme-black);
}
.card, .box, .panel, .modal, .form-card, .stat-card, .table-wrap, .content-card,
.package-card, .client-card, .upload-card, .success-card, .login-card {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:var(--theme-border) !important;
  box-shadow:0 5px 18px rgba(190,75,125,.10) !important;
  transition:box-shadow .25s ease, transform .25s ease, border-color .25s ease;
}
.card:hover, .box:hover, .panel:hover, .stat-card:hover, .package-card:hover, .client-card:hover {
  box-shadow:0 8px 22px rgba(190,75,125,.15) !important;
  border-color:#e7a9c4 !important;
}
h1,h2,h3,h4,h5,h6,p,label,small,span,td,th,li,div { }
h1,h2,h3,h4,h5,h6,p,label,td,th { color:inherit; }
.brand, .tag, .sidebar-brand h2, .section-title, .page-title, .logo-text,
a:not(.btn):not([class*="button"]) { color:var(--theme-pink-dark) !important; }
button, .btn, input[type="submit"], input[type="button"], .button, a.btn {
  background:var(--theme-pink) !important; color:#fff !important;
  border-color:var(--theme-pink) !important;
  box-shadow:0 3px 10px rgba(217,87,145,.16) !important;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
button:hover, .btn:hover, input[type="submit"]:hover, input[type="button"]:hover, .button:hover {
  background:var(--theme-pink-dark) !important; transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(217,87,145,.22) !important;
}
input, select, textarea {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:#e8c5d5 !important;
}
input::placeholder, textarea::placeholder { color:#a99aa1 !important; }
table th { background:var(--theme-pink-light) !important; color:#39232e !important; }
table td { color:var(--theme-black) !important; border-color:#f0dce5 !important; }
hr, .divider { border-color:var(--theme-border) !important; }
.badge, .pill, .status { border-color:#edc4d6 !important; }
@keyframes softFadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.card, .box, .panel, .stat-card, .package-card, .client-card { animation:softFadeUp .45s ease both; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>

:root{--bg:#ffffff!important;--surface:#ffffff!important;--soft:#fff3f7!important;--text:#171317!important;--muted:#765b68!important;--pink:#c2185b!important;--pink-main:#c2185b!important;--pink-dark:#880e4f!important;--pink-deep:#ad1457!important;--theme-pink:#c2185b!important;--theme-pink-dark:#880e4f!important;--theme-pink-light:#fff0f5!important;--theme-white:#fff!important;--theme-black:#171317!important;--theme-muted:#765b68!important;--theme-border:#f0bfd2!important}

.sidebar{border-right:1px solid #f0bfd2!important}
.sidebar-brand,.sidebar-footer{border-color:#f0bfd2!important}
.sidebar-brand h2,.page-top h4 span,.card-label,.nav-section,.section-title,.section-label,.ph-body label,.cat-label{color:#c2185b!important}
.nav-item,.logout-btn,.sidebar-nav a{color:#171317!important}
.nav-item:hover,.nav-item.active,.logout-btn:hover,.sidebar-nav a:hover{background:#fff0f5!important;color:#171317!important;border-color:#c2185b!important}
input,select,textarea,.sel,.ph-body input[type=text],.ph-body select{background:#fff!important;color:#171317!important;border:1px solid #e8b2c8!important}
input::placeholder,textarea::placeholder{color:#987b88!important}
button,.btn,.btn-primary,.btn-add,.save-btn,.action-btn{background:#c2185b!important;color:#fff!important;border-color:#c2185b!important;transition:all .22s ease!important}
button:hover,.btn:hover,.btn-primary:hover,.btn-add:hover,.save-btn:hover,.action-btn:hover{background:#171317!important;color:#fff!important;border-color:#171317!important;transform:translateY(-1px)}
.btn.del,.btn-delete,.delete-btn{background:#c2185b!important;color:#fff!important;border-color:#c2185b!important}
.btn.del:hover,.btn-delete:hover,.delete-btn:hover{background:#171317!important;color:#fff!important;border-color:#171317!important}
.file-pick{background:#fff5f8!important;color:#c2185b!important;border-color:#c2185b!important}
.file-pick:hover{background:#171317!important;color:#fff!important;border-color:#171317!important}
.tag,.badge,.status-badge{background:#c2185b!important;color:#fff!important}
hr{border-color:#f0bfd2!important}
.card,.ph,.table-card{border-radius:16px!important}
.ph{overflow:hidden!important}
.ph-body{color:#171317!important}
/* Keep status colours legible while preventing dark panels. */
.msg{background:#f0fff4!important;color:#236b3b!important}
</style>

<body>

<!-- MOBILE HEADER -->
<div class="mob-header">
    <button class="mob-menu-btn" onclick="toggleSidebar()">
        <i class="ti ti-menu-2"></i>
    </button>
    <h2>Saara Photography</h2>
</div>

<!-- OVERLAY (mobile only, closes sidebar on tap-outside) -->
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<nav class="sidebar">
    <div class="sidebar-brand">
        <h2>Saara Photography</h2>
        <p>Admin Panel</p>
    </div>
    <a th:href="@{/clients}" class="nav-item active"><i class="ti ti-users"></i>Clients</a>

    <a th:href="@{/owner/profile}" class="nav-item"><i class="ti ti-user-circle"></i>Profile</a>
	<a th:href="@{/owner/home-photos}" class="nav-item"><i class="ti ti-photo-star"></i>Work Photos</a>
	<a th:href="@{/owner/packages}" class="nav-item"><i class="ti ti-diamond"></i>Packages</a>
	<div class="sidebar-spacer"></div>
	
    <a th:href="@{/logout}" class="nav-item danger"><i class="ti ti-logout"></i>Logout</a>
</nav>

<!-- MAIN -->
<div class="main">
    <div class="page-top">
        <a th:href="@{/clients}" class="back-btn"><i class="ti ti-arrow-left"></i>Back</a>
        <h4>Add New Client</h4>
    </div>

    <div class="form-card">
        <div th:if="${errorMessage}" role="alert"
             style="background:#fff0f0;color:#a51d1d;border:1px solid #e8b2b2;border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14px;display:flex;align-items:center;gap:8px;">
            <i class="ti ti-alert-circle"></i>
            <span th:text="${errorMessage}">Error</span>
        </div>

        <form th:action="@{/clients/add}" th:object="${client}" method="post">

            <!-- Couple Name -->
            <div class="field">
                <label>Couple Name <span>*</span></label>
                <div class="input-wrap">
                    <input type="text" th:field="*{coupleName}" placeholder="Ravi &amp; Kavitha" required minlength="2" pattern=".*\S.*" title="Couple name is required">
                    <i class="ti ti-heart"></i>
                </div>
            </div>

            <!-- Phone -->
            <div class="field">
                <label>Phone <span>*</span></label>
                <div class="input-wrap">
                    <input th:field="*{phone}" placeholder="+91 97867 11698" type="tel" inputmode="tel" maxlength="16" required pattern="\+?[0-9][0-9\s\-]{8,14}[0-9]" title="Enter a valid phone number (10 digits)" oninput="this.value=this.value.replace(/[^0-9+\s-]/g,'')">
                    <i class="ti ti-phone"></i>
                </div>
            </div>

            <!-- Wedding Date -->
            <div class="field">
                <label>Wedding Date</label>
                <div class="input-wrap">
                    <input type="text" th:field="*{weddingDate}" placeholder="Select wedding date">
                    <i class="ti ti-calendar"></i>
                </div>
            </div>

            <!-- SECTION: Credentials -->
            <div class="section-sep">
                <div class="sep-line"></div>
                <div class="sep-label"><i class="ti ti-lock"></i>Gallery Login</div>
                <div class="sep-line"></div>
            </div>

            <!-- Username -->
            <div class="field">
                <label>Username <span>*</span></label>
                <div class="input-wrap">
                    <input type="text" th:field="*{accessToken}"
                           placeholder="e.g. ravi.kavitha" required
                           oninput="this.value=this.value.toLowerCase().replace(/\s/g,'')">
                    <i class="ti ti-user"></i>
                </div>
                <div class="field-hint">Client will use this to login to their gallery</div>
            </div>

            <!-- Password -->
            <div class="field">
                <label>Password <span>*</span></label>
                <div class="input-wrap">
                    <input type="text" th:field="*{accessPassword}"
                           placeholder="e.g. Wedding@2025" required>
