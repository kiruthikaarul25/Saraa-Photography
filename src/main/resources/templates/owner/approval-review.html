<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Approval</title>
<style>body{font-family:system-ui,sans-serif;background:#07040a;color:#fbeef4;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:16px}.card{max-width:420px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,95,162,.3);border-radius:16px;padding:32px;text-align:center}button{border:0;border-radius:10px;padding:12px 28px;font-size:16px;font-weight:700;color:#fff;cursor:pointer}.ok{background:#1f9d55}.no{background:#d93a5b}</style>
</head>
<body>
<div class="card">
  <h2 th:text="${signup} ? 'New Admin Signup' : 'Admin Password Change'">Request</h2>
  <p>Admin username: <strong th:text="${username}">user</strong></p>
  <p th:text="${action == 'accept'} ? 'Do you want to ACCEPT this request?' : 'Do you want to REJECT this request?'"></p>

  <form th:if="${action == 'accept'}" th:action="@{/owner/approval/{t}/accept(t=${token})}" method="post">
    <button class="ok" type="submit">Accept</button>
  </form>
  <form th:if="${action == 'reject'}" th:action="@{/owner/approval/{t}/reject(t=${token})}" method="post">
    <button class="no" type="submit">Reject</button>
  </form>
</div>
</body>
</html>
