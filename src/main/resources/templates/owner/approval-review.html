<script>
    (function () {
        try {
            var t = localStorage.getItem('saara-theme');
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');

<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═════════ THEME TOKENS ═════════ */
    :root, [data-theme="dark"] {
        --pink: #ff4d94; --pink-2: #ff7ab3; --pink-deep: #d92a76;
        --bg: #0c0809; --bar: #17101a; --card: #1c1420; --field: #150e18;
        --text: #fbeef4; --sub: #c9aebb; --muted: #8a7280;
        --bar-text: #c9aebb; --bar-hover: #1c1420;
        --out: 10px 10px 24px rgba(0,0,0,.65), -6px -6px 16px rgba(255,255,255,.045);
        --out-sm: 6px 6px 14px rgba(0,0,0,.6), -4px -4px 10px rgba(255,255,255,.04);
        --in: inset 4px 4px 10px rgba(0,0,0,.6), inset -3px -3px 8px rgba(255,255,255,.04);
        --btn: 8px 8px 20px rgba(255,77,148,.32), inset -4px -4px 10px rgba(180,20,90,.55), inset 4px 4px 10px rgba(255,160,205,.55);
        --bar-shadow: var(--out);
        --glow-a: rgba(255,77,148,.14); --glow-b: rgba(255,77,148,.10);
    }
    [data-theme="light"] {
        --pink: #ff3d8b; --pink-2: #ff7ab3; --pink-deep: #d92a76;
        --bg: #ffffff;                                                            /* center = white */
        --bar: linear-gradient(165deg, #ff8fc0 0%, #ff4d94 55%, #e0307a 100%);    /* nav = pink */
        --card: #ffffff; --field: #fff3f8;
        --text: #3b1d2c; --sub: #7d5568; --muted: #b48a9c;
        --bar-text: #ffffff; --bar-hover: rgba(255,255,255,.22);
        --out: 10px 10px 26px rgba(214,120,160,.30), -8px -8px 20px rgba(255,255,255,.95);
        --out-sm: 6px 6px 14px rgba(214,120,160,.26), -5px -5px 12px rgba(255,255,255,.95);
        --in: inset 4px 4px 10px rgba(214,120,160,.22), inset -4px -4px 10px rgba(255,255,255,.95);
        --btn: 8px 8px 20px rgba(255,61,139,.34), inset -4px -4px 10px rgba(200,30,100,.45), inset 4px 4px 10px rgba(255,170,210,.7);
        --bar-shadow: 12px 12px 28px rgba(255,61,139,.35), inset -5px -5px 12px rgba(190,25,95,.35), inset 5px 5px 12px rgba(255,190,220,.55);
        --glow-a: rgba(255,61,139,.06); --glow-b: rgba(255,61,139,.05);
    }
    :root { --r: 20px; }

    html { background: var(--bg); }
    body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text);
        min-height: 100vh; padding: 96px 16px 40px; display: flex; align-items: center; justify-content: center;
        background:
            radial-gradient(600px 420px at 90% -5%, var(--glow-a), transparent 70%),
            radial-gradient(560px 420px at 5% 105%, var(--glow-b), transparent 70%),
            var(--bg);
        background-attachment: fixed; transition: background .3s, color .3s;
    }
    button { font-family: inherit; }

    /* ═════════ TOP NAV (same on every page) ═════════ */
    .ss-nav {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        width: min(1180px, calc(100% - 24px)); height: 58px; z-index: 1000;
        display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px;
        border-radius: var(--r); background: var(--bar); box-shadow: var(--bar-shadow);
    }
    .ss-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; min-width: 0; overflow: hidden; color: var(--text); }
    [data-theme="light"] .ss-brand { color: #fff; }
    .ss-logo { position: relative; width: 34px; height: 34px; border-radius: 12px; overflow: hidden; flex-shrink: 0; display: block; }
    .ss-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ss-bt { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ss-links { display: flex; align-items: center; gap: 6px; }
    .ss-links a {
        position: relative; overflow: hidden; padding: 9px 14px; border-radius: 16px; text-decoration: none; white-space: nowrap;
        font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--bar-text); transition: all .2s;
    }
    .ss-links a:hover { color: var(--pink); background: var(--bar-hover); }
    [data-theme="light"] .ss-links a:hover { color: #fff; }
    .ss-links a.on { color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); }
    [data-theme="light"] .ss-links a.on { color: var(--pink); background: #fff; box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
    .ss-cta {
        padding: 10px 16px; border-radius: 16px; text-decoration: none; white-space: nowrap; color: #fff;
        font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
        background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
    }
    [data-theme="light"] .ss-cta { color: var(--pink); background: #fff; box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
    .ss-ic {
        width: 40px; height: 40px; border-radius: 15px; border: 0; cursor: pointer; padding: 0; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; color: var(--pink); background: var(--card); box-shadow: var(--out-sm);
    }
    [data-theme="light"] .ss-ic { background: #fff; box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
    .ss-ic svg { width: 19px; height: 19px; }
    .ss-ic:active { box-shadow: var(--in); }
    [data-theme="dark"] .ss-moon, [data-theme="light"] .ss-sun { display: none; }
    .ss-burger { display: none; }

    /* floating Instagram — bottom right */
    .ss-ig {
        position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 1100;
        width: 52px; height: 52px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
        color: #fff; text-decoration: none; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); transition: transform .2s;
    }
    .ss-ig svg { width: 25px; height: 25px; }
    .ss-ig:hover { transform: translateY(-3px); }
    .ss-ig:active { transform: scale(.95); }

    /* click animation */
    .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: scale(0); background: rgba(255,77,148,.35); animation: rip .6s ease-out forwards; }
    [data-theme="light"] .ripple { background: rgba(255,255,255,.55); }
    .ss-links a.on .ripple { background: rgba(255,255,255,.5); }
    [data-theme="light"] .ss-links a.on .ripple { background: rgba(255,61,139,.3); }
    @keyframes rip { to { transform: scale(1); opacity: 0; } }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(.94); } 70% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .pop { animation: pop .35s ease; }

    /* ═════════ APPROVAL CARD ═════════ */
    .card {
        width: 100%; max-width: 440px; padding: 36px 30px; text-align: center; border-radius: var(--r);
        background: var(--card); box-shadow: var(--out); animation: rise .6s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .badge-ico {
        width: 64px; height: 64px; margin: 0 auto 18px; border-radius: var(--r); display: flex; align-items: center; justify-content: center;
        color: var(--pink); background: var(--card); box-shadow: var(--in);
    }
    .badge-ico svg { width: 30px; height: 30px; }
    .card h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 18px; color: var(--text); }
    .card p { font-size: .92rem; line-height: 1.6; color: var(--sub); margin-bottom: 10px; }
    .user-pill {
        display: inline-block; margin: 2px 0 14px; padding: 10px 18px; border-radius: var(--r); background: var(--field); box-shadow: var(--in);
        font-size: .9rem; color: var(--sub);
    }
    .user-pill strong { color: var(--pink); font-weight: 700; }
    .question { font-weight: 600; color: var(--text) !important; margin: 6px 0 22px !important; }
    form { margin-top: 4px; }
    button {
        width: 100%; border: 0; cursor: pointer; padding: 15px 28px; border-radius: var(--r); color: #fff;
        font-size: .85rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; transition: transform .2s, filter .2s;
    }
    button:hover { filter: brightness(1.07); transform: translateY(-2px); }
    button:active { transform: translateY(0); filter: brightness(.95); }
    .ok { background: linear-gradient(145deg, #4fe3a0, #1f9d55); box-shadow: 8px 8px 20px rgba(31,157,85,.32), inset -4px -4px 10px rgba(10,100,50,.5), inset 4px 4px 10px rgba(160,255,210,.5); }
    .no { background: linear-gradient(145deg, #ff7a93, #d93a5b); box-shadow: 8px 8px 20px rgba(217,58,91,.32), inset -4px -4px 10px rgba(150,20,50,.5), inset 4px 4px 10px rgba(255,170,190,.5); }

    /* ═════════ RESPONSIVE ═════════ */
    @media (max-width: 900px) {
        .ss-cta { display: none; }
        .ss-burger { display: flex; }
        .ss-links {
            position: absolute; top: 66px; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px;
            border-radius: var(--r); background: var(--bar); box-shadow: var(--bar-shadow); display: none;
        }
        .ss-links.open { display: flex; }
        .ss-links a { padding: 13px 16px; font-size: 12px; }
    }
    @media (max-width: 480px) {
        .ss-ig { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; border-radius: 18px; }
        .ss-bt { font-size: 11.5px; letter-spacing: .08em; }
        .card { padding: 28px 20px; }
    }
</style>

<script>
    (function () {
        var root = document.documentElement;
        document.getElementById('ssTheme').addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('saara-theme', next); } catch (e) {}
        });
        var b = document.getElementById('ssBurger'), l = document.getElementById('ssLinks');
        b.addEventListener('click', function () {
            var o = l.classList.toggle('open');
            b.setAttribute('aria-expanded', o ? 'true' : 'false');
        });
        l.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function (e) {
                var href = a.getAttribute('href'), r = a.getBoundingClientRect(), d = Math.max(r.width, r.height) * 1.6, s = document.createElement('span');
                s.className = 'ripple'; s.style.width = s.style.height = d + 'px';
                s.style.left = (e.clientX - r.left - d / 2) + 'px'; s.style.top = (e.clientY - r.top - d / 2) + 'px';
                a.appendChild(s); a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop');
                setTimeout(function () { s.remove(); a.classList.remove('pop'); }, 600);
                if (!href || href.charAt(0) === '#' || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
                e.preventDefault();
                setTimeout(function () { location.href = href; }, 260);
            });
        });
    })();
</script>

<script>
/* Auto-close mobile menu / admin sidebar when the page is scrolled or tapped outside */
(function(){
  var links=document.getElementById('ssLinks'),burger=document.getElementById('ssBurger'),
      side=document.getElementById('sidebar'),ov=document.getElementById('overlay');
  function isOpen(){return (links&&links.classList.contains('open'))||(side&&side.classList.contains('open'));}
  function closeAll(){
    if(links&&links.classList.contains('open')){links.classList.remove('open');if(burger)burger.setAttribute('aria-expanded','false');}
    if(side&&side.classList.contains('open')){side.classList.remove('open');if(ov)ov.classList.remove('show');}
  }
  function inside(t){return t&&t.closest&&(t.closest('#ssLinks')||t.closest('#ssBurger')||t.closest('#sidebar')||t.closest('.hamburger'));}
  var y0=0;
  function onScroll(e){if(isOpen()&&!inside(e.target)){var y=window.pageYOffset||0;if(Math.abs(y-y0)>4||e.target!==document)closeAll();}}
  window.addEventListener('scroll',onScroll,true);
  window.addEventListener('wheel',function(e){if(isOpen()&&!inside(e.target))closeAll();},{passive:true});
  window.addEventListener('touchstart',function(e){y0=window.pageYOffset||0;if(isOpen()&&!inside(e.target)&&!(ov&&e.target===ov))closeAll();},{passive:true});
  window.addEventListener('touchmove',function(e){if(isOpen()&&!inside(e.target))closeAll();},{passive:true});
  document.addEventListener('click',function(e){if(isOpen()&&!inside(e.target))closeAll();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
})();
</script>
<script>
/* top nav: hide on scroll down, show on scroll up */
(function () {
  var nav = document.querySelector('.ss-nav'), links = document.getElementById('ssLinks');
  var last = window.pageYOffset || 0, ticking = false;
  if (!nav) return;
  function update() {
    var y = window.pageYOffset || 0;
    if (links && links.classList.contains('open')) { last = y; ticking = false; return; }
    if (y > last + 6 && y > 80) nav.classList.add('ss-hide');
    else if (y < last - 6 || y <= 10) nav.classList.remove('ss-hide');
    last = y; ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();
</script>
