<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client — Saara Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('saara-theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) {}
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ═════════ THEME TOKENS ═════════ */
        :root, [data-theme="dark"] {
            --pink: #ff4d94; --pink-2: #ff7ab3; --pink-deep: #d92a76;
            --bg: #0c0809;
            --side: #17101a;
            --card: #1c1420;
            --field: #150e18;
            --text: #fbeef4; --sub: #c9aebb; --muted: #8a7280;
            --side-text: #c9aebb; --side-muted: #8a7280; --side-hover: #1c1420;
            --line: rgba(255,255,255,.08);
            --out: 10px 10px 24px rgba(0,0,0,.65), -6px -6px 16px rgba(255,255,255,.045);
            --out-sm: 6px 6px 14px rgba(0,0,0,.6), -4px -4px 10px rgba(255,255,255,.04);
            --in: inset 4px 4px 10px rgba(0,0,0,.6), inset -3px -3px 8px rgba(255,255,255,.04);
            --btn: 8px 8px 20px rgba(255,77,148,.32), inset -4px -4px 10px rgba(180,20,90,.55), inset 4px 4px 10px rgba(255,160,205,.55);
            --side-shadow: var(--out);
            --glow-a: rgba(255,77,148,.14); --glow-b: rgba(255,77,148,.10);
        }
        [data-theme="light"] {
            --pink: #ff3d8b; --pink-2: #ff7ab3; --pink-deep: #d92a76;
            --bg: #ffffff;
            --side: linear-gradient(165deg, #ff8fc0 0%, #ff4d94 55%, #e0307a 100%);
            --card: #ffffff;
            --field: #fff3f8;
            --text: #3b1d2c; --sub: #7d5568; --muted: #b48a9c;
            --side-text: #ffffff; --side-muted: rgba(255,255,255,.75); --side-hover: rgba(255,255,255,.18);
            --line: rgba(255,61,139,.14);
            --out: 10px 10px 26px rgba(214,120,160,.30), -8px -8px 20px rgba(255,255,255,.95);
            --out-sm: 6px 6px 14px rgba(214,120,160,.26), -5px -5px 12px rgba(255,255,255,.95);
            --in: inset 4px 4px 10px rgba(214,120,160,.22), inset -4px -4px 10px rgba(255,255,255,.95);
            --btn: 8px 8px 20px rgba(255,61,139,.34), inset -4px -4px 10px rgba(200,30,100,.45), inset 4px 4px 10px rgba(255,170,210,.7);
            --side-shadow: 12px 12px 28px rgba(255,61,139,.35), inset -5px -5px 12px rgba(190,25,95,.35), inset 5px 5px 12px rgba(255,190,220,.55);
            --glow-a: rgba(255,61,139,.08); --glow-b: rgba(255,61,139,.06);
        }
        :root { --r: 20px; }

        html { background: var(--bg); transition: background .3s; }
        body {
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            color: var(--text); min-height: 100vh; padding-top: 84px;
            background:
                radial-gradient(600px 420px at 90% -5%, var(--glow-a), transparent 70%),
                radial-gradient(560px 420px at 5% 105%, var(--glow-b), transparent 70%),
                var(--bg);
            background-attachment: fixed;
            transition: background .3s, color .3s;
        }
        button, input, select { font-family: inherit; }

        /* ═════════ TOP NAV ═════════ */
        .ss-nav {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            width: min(1180px, calc(100% - 24px)); height: 58px; z-index: 1000;
            display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px;
            border-radius: var(--r); background: var(--card); box-shadow: var(--out);
        }
        .ss-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; min-width: 0; overflow: hidden; }
        .ss-logo { position: relative; width: 34px; height: 34px; border-radius: 12px; overflow: hidden; flex-shrink: 0; display: block; }
        .ss-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .ss-bt { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ss-links { display: flex; align-items: center; gap: 6px; }
        .ss-links a {
            padding: 9px 14px; border-radius: 16px; text-decoration: none; font-size: 11.5px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--sub); transition: all .2s; white-space: nowrap;
        }
        .ss-links a:hover { color: var(--pink); background: var(--card); box-shadow: var(--out-sm); }
        .ss-links a.on { color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); }
        .ss-cta {
            padding: 10px 16px; border-radius: 16px; text-decoration: none; font-size: 11px; font-weight: 700;
            letter-spacing: .12em; text-transform: uppercase; color: #fff; white-space: nowrap;
            background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
        }
        .ss-ic {
            width: 40px; height: 40px; border-radius: 15px; border: 0; cursor: pointer; padding: 0; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: var(--pink);
            background: var(--card); box-shadow: var(--out-sm); text-decoration: none;
        }
        .ss-ic svg { width: 19px; height: 19px; }
        .ss-ic:active { box-shadow: var(--in); }
        [data-theme="dark"] .ss-moon, [data-theme="light"] .ss-sun { display: none; }
        .ss-burger { display: none; }

        /* ═════════ SIDEBAR ═════════ */
        .sidebar {
            position: fixed; top: 84px; left: 12px; bottom: 12px; width: 250px; z-index: 900;
            padding: 20px 14px; display: flex; flex-direction: column; overflow-y: auto;
            background: var(--side); border-radius: var(--r); box-shadow: var(--side-shadow);
            transition: transform .3s ease, background .3s;
        }
        .sidebar::-webkit-scrollbar { width: 0; }
        .sb-brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 16px; }
        .sb-ico {
            width: 42px; height: 42px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 21px; color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
        }
        [data-theme="light"] .sb-ico { background: #fff; color: var(--pink); box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
        .sb-name { display: block; font-weight: 800; font-size: 14px; letter-spacing: .14em; color: var(--side-text); }
        [data-theme="dark"] .sb-name { color: var(--text); }
        .sb-sub { display: block; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; margin-top: 2px; color: var(--side-muted); }
                                                        .sb-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; margin: 4px 8px 10px; color: var(--side-muted); }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r);
            text-decoration: none; font-size: 13px; font-weight: 500; color: var(--side-text); transition: all .2s; white-space: nowrap;
        }
        .nav-item i { font-size: 18px; width: 20px; flex-shrink: 0; }
        .nav-item:hover { background: var(--side-hover); box-shadow: var(--out-sm); }
        [data-theme="dark"] .nav-item:hover { color: var(--pink); }
        .nav-item.active { color: #fff; font-weight: 600; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); }
        [data-theme="light"] .nav-item.active { background: #fff; color: var(--pink); box-shadow: 6px 6px 14px rgba(190,25,95,.32), -3px -3px 8px rgba(255,200,225,.5); }
        .promo { margin-top: 12px; padding: 16px; border-radius: var(--r); background: var(--card); box-shadow: var(--out-sm); }
        .promo .rk { font-size: 30px; display: block; margin-bottom: 6px; }
        .promo h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
        .promo p { font-size: 11px; line-height: 1.5; margin-bottom: 12px; color: var(--muted); }
        .promo a {
            display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 16px; text-decoration: none;
            font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
        }
        .logout-btn {
            margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r);
            text-decoration: none; font-size: 13px; font-weight: 600; color: #ff6b81; transition: all .2s;
        }
        [data-theme="light"] .logout-btn { color: #fff; }
        .logout-btn:hover { background: var(--side-hover); box-shadow: var(--out-sm); }

        .hamburger {
            display: none; position: fixed; top: 80px; left: 14px; z-index: 950; width: 44px; height: 44px; border: 0; cursor: pointer;
            border-radius: 16px; font-size: 22px; align-items: center; justify-content: center; color: var(--pink);
            background: var(--card); box-shadow: var(--out-sm);
        }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 850; }
        .sidebar-overlay.show { display: block; }

        /* ═════════ MAIN ═════════ */
        .main { margin-left: 276px; padding: 30px 36px 60px; min-width: 0; }
        .page-top { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
        .back-btn {
            display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--r); text-decoration: none;
            font-size: .72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sub);
            background: var(--card); box-shadow: var(--out-sm); transition: all .2s;
        }
        .back-btn:hover { color: var(--pink); }
        .back-btn:active { box-shadow: var(--in); }
        .page-top h4 { font-size: 1.25rem; font-weight: 700; letter-spacing: 2px; color: var(--text); }

        .form-card { max-width: 560px; padding: 36px 32px; border-radius: var(--r); background: var(--card); box-shadow: var(--out); }

        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 8px; font-size: .68rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }
        .input-wrap { position: relative; }
        .input-wrap > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--muted); pointer-events: none; transition: color .3s; z-index: 1; }
        .input-wrap:focus-within > i { color: var(--pink); }
        .field input, .field select {
            width: 100%; padding: 14px 16px 14px 44px; border: 0; outline: 0; border-radius: var(--r);
            background: var(--field); box-shadow: var(--in); color: var(--text); font-size: .88rem; font-weight: 500; transition: box-shadow .25s;
        }
        .field input::placeholder { color: var(--muted); }
        .field input:focus, .field select:focus { box-shadow: var(--in), 0 0 0 2px var(--pink); }
        .field select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 44px; }
        .field select option { background: var(--card); color: var(--text); }
        .input-wrap .sel-arrow { left: auto; right: 16px; }

        .section-sep { display: flex; align-items: center; gap: 12px; margin: 28px 0 22px; }
        .section-sep:first-child { margin-top: 0; }
        .sep-line { flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
        .sep-label { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: .65rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); }

        .btn-submit {
            width: 100%; margin-top: 8px; padding: 15px; border: 0; cursor: pointer; border-radius: var(--r); color: #fff;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: .8rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); transition: transform .2s, filter .2s;
        }
        .btn-submit:hover { filter: brightness(1.06); transform: translateY(-2px); }
        .btn-submit:active { transform: translateY(0); filter: brightness(.96); }

        /* calendar */
        .flatpickr-calendar { background: var(--card) !important; border: 0 !important; border-radius: var(--r) !important; box-shadow: var(--out) !important; font-family: 'Poppins', sans-serif !important; overflow: hidden; z-index: 99999 !important; }
        .flatpickr-calendar:before, .flatpickr-calendar:after { display: none !important; }
        .flatpickr-months { background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)) !important; }
        .flatpickr-months *, .flatpickr-current-month input.cur-year { color: #fff !important; fill: #fff !important; background: transparent !important; font-weight: 600; }
        .flatpickr-weekdays, span.flatpickr-weekday { background: var(--field) !important; color: var(--pink) !important; font-weight: 700 !important; }
        .flatpickr-day { color: var(--text) !important; border-radius: 14px !important; }
        .flatpickr-day:hover { background: var(--field) !important; border-color: transparent !important; }
        .flatpickr-day.today { border-color: var(--pink) !important; }
        .flatpickr-day.selected, .flatpickr-day.selected:hover { background: var(--pink) !important; border-color: var(--pink) !important; color: #fff !important; }
        .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--muted) !important; }

        /* click animation */
        .nav-item, .ss-links a, .promo a { position: relative; overflow: hidden; }
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none; transform: scale(0);
            background: rgba(255,77,148,.35); animation: rip .6s ease-out forwards;
        }
        [data-theme="light"] .sidebar .ripple, [data-theme="light"] .ss-nav .ripple { background: rgba(255,255,255,.55); }
        .nav-item.active .ripple, .ss-links a.on .ripple, .promo a .ripple { background: rgba(255,255,255,.5); }
        [data-theme="light"] .nav-item.active .ripple { background: rgba(255,77,148,.3); }
        @keyframes rip { to { transform: scale(1); opacity: 0; } }
        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(.94); } 70% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .nav-item.pop, .ss-links a.pop, .promo a.pop { animation: pop .35s ease; }
        .nav-item:hover { transform: translateX(4px); }
        .nav-item i { transition: transform .25s; }
        .nav-item:hover i, .nav-item.pop i { transform: scale(1.18) rotate(-6deg); }
        .nav-item.active { animation: slideIn .45s ease both; }
        @keyframes slideIn { from { opacity: .4; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

        /* light theme: top nav + sidebar are PINK */
        [data-theme="light"] .ss-nav { background: var(--side); box-shadow: var(--side-shadow); }
        [data-theme="light"] .ss-brand, [data-theme="light"] .ss-bt { color: #fff; }
        [data-theme="light"] .ss-links a { color: rgba(255,255,255,.9); }
        [data-theme="light"] .ss-links a:hover { color: #fff; background: rgba(255,255,255,.22); box-shadow: none; }
        [data-theme="light"] .ss-links a.on { color: var(--pink); background: #fff; box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
        [data-theme="light"] .ss-cta { color: var(--pink); background: #fff; box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
        [data-theme="light"] .ss-ic { background: #fff; color: var(--pink); box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
        @media (max-width: 900px) { [data-theme="light"] .ss-links { background: var(--side); box-shadow: var(--side-shadow); } }

        .ss-ig {
            position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 1100;
            width: 52px; height: 52px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); transition: transform .2s;
        }
        .ss-ig svg { width: 25px; height: 25px; }
        .ss-ig:hover { transform: translateY(-3px); }
        .ss-ig:active { transform: scale(.95); }

        /* ═════════ RESPONSIVE ═════════ */
        @media (max-width: 900px) {
            .ss-cta { display: none; }
            .ss-burger { display: flex; }
            .ss-links {
                position: absolute; top: 66px; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px;
                border-radius: var(--r); background: var(--card); box-shadow: var(--out); display: none;
            }
            .ss-links.open { display: flex; }
            .ss-links a { padding: 13px 16px; font-size: 12px; }
        }
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .sidebar { top: 76px; bottom: 0; left: 0; width: 270px; border-radius: 0 var(--r) var(--r) 0; transform: translateX(-110%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 70px 16px 50px; }
            .form-card { padding: 26px 18px; }
        }
        @media (max-width: 480px) {
            .ss-ig { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; border-radius: 18px; }
            .ss-bt { font-size: 11.5px; letter-spacing: .08em; }
        }
    </style>
<link rel="stylesheet" href="/css/saara-nav.css?v=1">
<style id="ss-nav-blur">
/* top nav: slightly blurred + transparent glass (blur sits on a pseudo layer so the mobile menu keeps its own blur) */
html body .ss-nav::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:rgba(14,8,18,.28);
 -webkit-backdrop-filter:blur(8px) saturate(135%);backdrop-filter:blur(8px) saturate(135%);
 border-bottom:1px solid rgba(255,255,255,.07);transition:background .3s}
html[data-theme="light"] body .ss-nav::before{background:rgba(255,255,255,.34);border-bottom:1px solid rgba(255,61,139,.12)}
</style>

<body>

<!-- ═════════ TOP NAV ═════════ -->
<header class="ss-nav" role="banner">
    <a class="ss-brand" href="/" aria-label="Saara Photography home">
        <span class="ss-logo"><img src="/images/logo.png" alt="" onerror="this.parentNode.remove()"></span>
        <span class="ss-bt">Saara Photography</span>
    </a>
    <nav class="ss-links" id="ssLinks" aria-label="Main">
        <a href="/">Home</a>
        <a href="/work">Work</a>
        <a href="/select">Select</a>
        <a href="/packages-page">Packages</a>
        <a href="/contact">Contact</a>
    </nav>
    <button class="ss-ic" id="ssTheme" type="button" aria-label="Toggle light and dark mode">
        <svg class="ss-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ss-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="ss-ic ss-burger" id="ssBurger" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
</header>

<a class="ss-ig" href="https://www.instagram.com/saaraphotography05" target="_blank" rel="noopener" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
</a>

<button class="hamburger" onclick="toggleSidebar()" aria-label="Admin menu"><i class="ti ti-layout-sidebar-left-expand"></i></button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- ═════════ SIDEBAR ═════════ -->
<aside class="sidebar" id="sidebar">
    <div class="sb-brand">
        <div class="sb-ico"><i class="ti ti-camera"></i></div>
        <div><span class="sb-name">SAARA</span><span class="sb-sub">Admin Panel</span></div>
    </div>
    <div class="sb-label">Menu</div>
    <nav id="navList">
        <a th:href="@{/clients}" class="nav-item active"><i class="ti ti-users"></i>Clients</a>
        <a th:href="@{/owner/home-photos}" class="nav-item"><i class="ti ti-photo-star"></i>Work Photos</a>
        <a th:href="@{/owner/packages}" class="nav-item"><i class="ti ti-diamond"></i>Packages</a>
        <a th:href="@{/admin/contact-enquiries}" class="nav-item"><i class="ti ti-mail"></i>Contact Enquiries</a>
        <a th:href="@{/owner/profile}" class="nav-item"><i class="ti ti-user-circle"></i>Profile</a>
    </nav>
    <div class="promo">
        <span class="rk">&#128640;</span>
        <h4>Grow your studio</h4>
        <p>Add a new client and share their photo gallery link in minutes.</p>
        <a th:href="@{/clients/add}"><i class="ti ti-user-plus"></i> Add Client</a>
    </div>
    <a th:href="@{/logout}" class="logout-btn"><i class="ti ti-logout"></i>Logout</a>
</aside>

<!-- ═════════ MAIN ═════════ -->
<div class="main">
    <div class="page-top">
        <a th:href="@{/clients/{id}(id=${client.id})}" class="back-btn"><i class="ti ti-arrow-left"></i>Back</a>
        <h4>Edit Client</h4>
    </div>

    <div class="form-card">
        <form th:action="@{/clients/{id}/edit(id=${client.id})}" method="post">

            <div class="section-sep">
                <div class="sep-line"></div>
                <div class="sep-label"><i class="ti ti-heart"></i>Couple Details</div>
                <div class="sep-line"></div>
            </div>

            <div class="field">
                <label>Couple Name</label>
                <div class="input-wrap">
                    <input type="text" name="coupleName" th:value="${client.coupleName}" placeholder="e.g. Rahul &amp; Priya" required minlength="2" pattern=".*\S.*" title="Couple name is required">
                    <i class="ti ti-heart"></i>
                </div>
            </div>

            <div class="field">
                <label>Phone</label>
                <div class="input-wrap">
                    <input name="phone" th:value="${client.phone}" placeholder="+91 97867 11698" type="tel" inputmode="tel" maxlength="16" required pattern="\+?[0-9][0-9\s\-]{8,14}[0-9]" title="Enter a valid phone number (10 digits)" oninput="this.value=this.value.replace(/[^0-9+\s-]/g,'')">
                    <i class="ti ti-phone"></i>
                </div>
            </div>

            <div class="field">
                <label>Wedding Date</label>
                <div class="input-wrap">
                    <input type="text" name="weddingDate" th:value="${client.weddingDate}" placeholder="Select wedding date">
                    <i class="ti ti-calendar"></i>
                </div>
            </div>

            <div class="section-sep">
                <div class="sep-line"></div>
                <div class="sep-label"><i class="ti ti-settings"></i>Account Settings</div>
                <div class="sep-line"></div>
            </div>

            <div class="field">
                <label>Status</label>
                <div class="input-wrap">
                    <select name="status">
                        <option value="active"    th:selected="${client.status == 'active'}">Active</option>
                        <option value="pending"   th:selected="${client.status == 'pending'}">Pending</option>
                        <option value="selecting" th:selected="${client.status == 'selecting'}">Selecting</option>
                        <option value="paid"      th:selected="${client.status == 'paid'}">Paid</option>
                        <option value="done"      th:selected="${client.status == 'done'}">Done</option>
                    </select>
                    <i class="ti ti-circle-check"></i>
                    <i class="ti ti-chevron-down sel-arrow"></i>
                </div>
            </div>

            <div class="field">
                <label>Username (leave blank to keep)</label>
                <div class="input-wrap">
                    <input type="text" name="accessToken" placeholder="Leave blank to keep current"
                           oninput="this.value=this.value.toLowerCase().replace(/\s/g,'')">
                    <i class="ti ti-user"></i>
                </div>
            </div>

            <div class="field">
                <label>Password (leave blank to keep)</label>
                <div class="input-wrap">
                    <input type="text" name="accessPassword" placeholder="Leave blank to keep current">
                    <i class="ti ti-key"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit"><i class="ti ti-device-floppy"></i> Save Changes</button>
        </form>
    </div>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }
    (function () {
        var root = document.documentElement;
        document.getElementById('ssTheme').addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('saara-theme', next); } catch (e) {}
        });
        var b = document.getElementById('ssBurger'), l = document.getElementById('ssLinks');
        b.addEventListener('click', function () {
            var o = l.classList.toggle('open');
            b.setAttribute('aria-expanded', o ? 'true' : 'false');
        });
        var p = location.pathname.replace(/\/+$/, '') || '/';
        l.querySelectorAll('a').forEach(function (a) { if (a.getAttribute('href') === p) a.classList.add('on'); });

        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        });
    })();

    /* click animation: ripple + pop, then go to the page */
    (function () {
        function bind(sel) {
            document.querySelectorAll(sel).forEach(function (a) {
                a.addEventListener('click', function (e) {
                    var href = a.getAttribute('href');
                    var r = a.getBoundingClientRect();
                    var d = Math.max(r.width, r.height) * 1.6;
                    var s = document.createElement('span');
                    s.className = 'ripple';
                    s.style.width = s.style.height = d + 'px';
                    s.style.left = (e.clientX - r.left - d / 2) + 'px';
                    s.style.top = (e.clientY - r.top - d / 2) + 'px';
                    a.appendChild(s);
                    a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop');
                    setTimeout(function () { s.remove(); a.classList.remove('pop'); }, 600);
                    if (!href || href.charAt(0) === '#' || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
                    e.preventDefault();
                    setTimeout(function () { location.href = href; }, 260);
                });
            });
        }
        bind('#navList a'); bind('.promo a'); bind('.ss-links a');
    })();
</script>

<script src="/js/constants.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>

    // calendar (value still saved as yyyy-MM-dd)
    flatpickr('input[name="weddingDate"]', {
        altInput: true,
        altFormat: 'd M Y',
        dateFormat: 'Y-m-d',
        disableMobile: true
    });
</script>
<script src="/js/saara-nav.js"></script>
