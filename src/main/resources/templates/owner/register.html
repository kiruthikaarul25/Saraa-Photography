
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Saara Photography</title>

    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">

    <style>
        :root {
            --pink: #ff4f9a;
            --pink-dark: #c2185b;
            --soft: #ffb3d1;
            --text: #fbeef4;
            --muted: #dcb6c8;
            --glass: rgba(255,255,255,.055);
            --line: rgba(255,95,162,.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #07040a;
            color-scheme: dark;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px 100px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, rgba(255,79,154,.19), transparent 45%),
                radial-gradient(ellipse at 85% 80%, rgba(194,24,91,.19), transparent 45%),
                linear-gradient(145deg, #210c20, #07040a 65%);
            overflow-x: hidden;
        }

        #bokeh {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 34px 28px;
            border: 1px solid rgba(255,79,154,.65);
            border-top: 3px solid var(--pink);
            border-radius: 22px;
            background: rgba(255,255,255,.075);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 65px rgba(0,0,0,.55),
                        0 0 35px rgba(255,79,154,.12);
            animation: appear .8s ease both;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: block;
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--pink);
            padding: 4px;
            background: #111;
            margin: 0 auto 15px;
            box-shadow: 0 0 25px rgba(255,79,154,.35);
        }

        .tag {
            display: block;
            text-align: center;
            font-size: 11px;
            letter-spacing: 5px;
            color: var(--soft);
            text-transform: uppercase;
            padding: 5px;
            border: 1px solid var(--line);
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: var(--soft);
            font-size: 2rem;
            margin: 10px 0 24px;
        }

        label {
            display: block;
            font-size: .78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 17px 0 7px;
            color: #fbeef4;
        }

        .field {
            position: relative;
        }

        .field input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255,79,154,.45);
            border-radius: 13px;
            background: rgba(0,0,0,.48);
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: .3s;
        }

        .field input:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(255,79,154,.17),
                        0 0 20px rgba(255,79,154,.2);
        }

        .field input::placeholder {
            color: rgba(255,255,255,.48);
            font-weight: 400;
        }

        .field.pw input {
            padding-right: 48px;
        }

        .toggle-pw {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            background: transparent;
            color: var(--soft);
            font-size: 20px;
            cursor: pointer;
        }

        .submit {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(110deg, #ff7eb6, #ff247d);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255,36,125,.35);
            transition: .3s;
        }

        .submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255,36,125,.55);
        }

        .submit:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        .msg {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: .9rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .msg.err {
            display: block;
            color: #ffc1ce;
            background: rgba(220,30,70,.15);
            border: 1px solid rgba(255,80,110,.5);
        }

        .msg.ok {
            display: block;
            color: #a7f3c5;
            background: rgba(40,180,100,.12);
            border: 1px solid rgba(80,220,140,.4);
        }

        .links {
            text-align: center;
            margin-top: 22px;
            font-size: .92rem;
            line-height: 2.2;
            color: var(--muted);
        }

        .links a {
            color: var(--pink);
            text-decoration: none;
        }

        .links a:hover {
            color: white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 10px 0 max(10px, env(safe-area-inset-bottom));
            background: rgba(8,4,10,.85);
            backdrop-filter: blur(18px);
            border-top: 1px solid var(--line);
        }

        .bottom-nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            max-width: 520px;
            margin: auto;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            text-decoration: none;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: .3s;
        }

        .bottom-nav a i {
            font-size: 21px;
        }

        .bottom-nav a:hover,
        .bottom-nav a.active {
            color: var(--pink);
            transform: translateY(-3px);
        }

        .floating-social {
            position: fixed;
            right: 18px;
            bottom: 95px;
            z-index: 5;
        }

        .instagram-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg,#ff4f9a,#c2185b);
            color: white;
            font-size: 25px;
            text-decoration: none;
            box-shadow: 0 0 22px rgba(255,79,154,.4);
        }

        @media(max-width:480px) {
            body {
                padding: 20px 13px 105px;
            }

            .box {
                padding: 27px 19px;
            }

            .logo {
                width: 82px;
                height: 82px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .tag {
                letter-spacing: 3px;
                font-size: 9px;
            }

            .bottom-nav a {
                font-size: 7.5px;
            }

            .bottom-nav a i {
                font-size: 19px;
            }
        }

        @media(prefers-reduced-motion:reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<canvas id="bokeh" aria-hidden="true"></canvas>

<div class="box">

    <img class="logo" src="/images/logo.png"
         alt="Saara Photography logo">

    <span class="tag">Saara Photography</span>

    <h1>Sign Up</h1>

    <form id="form" autocomplete="on">

        <label for="username">Username</label>
        <div class="field">
            <input type="text"
                   id="username"
                   autocomplete="username"
                   placeholder="Choose a username"
                   minlength="3"
                   maxlength="30"
                   required>
        </div>

        <label for="password">Password</label>
        <div class="field pw">
            <input type="password"
                   id="password"
                   autocomplete="new-password"
                   placeholder="Create password (min 6 characters)"
                   minlength="6"
                   required>

            <button type="button"
                    class="toggle-pw"
                    data-target="password"
                    aria-label="Show password">
                <i class="ti ti-eye"></i>
            </button>
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="field pw">
            <input type="password"
                   id="confirmPassword"
                   autocomplete="new-password"
                   placeholder="Confirm password"
                   required>

            <button type="button"
                    class="toggle-pw"
                    data-target="confirmPassword"
                    aria-label="Show password">
                <i class="ti ti-eye"></i>
            </button>
        </div>

        <button class="submit" type="submit" id="submitBtn">
            Sign Up
        </button>

        <div class="msg" id="msg" role="status"
             aria-live="polite"></div>

    </form>

    <div class="links">
        Already have an account?
        <a href="/login">Login</a>
        <br>
        <a href="/">
            <i class="ti ti-arrow-left"></i>
            Back to website
        </a>
    </div>

</div>

<nav class="bottom-nav">
    <ul>
        <li><a href="/"><i class="ti ti-home"></i><span>Home</span></a></li>
        <li><a href="/work"><i class="ti ti-video"></i><span>Work</span></a></li>
        <li><a href="/select"><i class="ti ti-photo"></i><span>Select</span></a></li>
        <li><a href="/packages-page"><i class="ti ti-diamond"></i><span>Packages</span></a></li>
        <li><a href="/contact"><i class="ti ti-phone"></i><span>Contact</span></a></li>
    </ul>
</nav>

<div class="floating-social">
    <a href="https://www.instagram.com/saaraphotography05"
       target="_blank"
       rel="noopener"
       class="instagram-btn"
       aria-label="Instagram">
        <i class="ti ti-brand-instagram"></i>
    </a>
</div>

<script>
    // Show / Hide Password
    document.querySelectorAll('.toggle-pw').forEach(function(button) {
        button.addEventListener('click', function() {
            const input = document.getElementById(button.dataset.target);
            const show = input.type === 'password';

            input.type = show ? 'text' : 'password';

            button.querySelector('i').className =
                show ? 'ti ti-eye-off' : 'ti ti-eye';

            button.setAttribute(
                'aria-label',
                show ? 'Hide password' : 'Show password'
            );
        });
    });

    function showMessage(message, success) {
        const msg = document.getElementById('msg');
        msg.textContent = message;
        msg.className = 'msg ' + (success ? 'ok' : 'err');
    }

    // Signup: no SMS OTP; request owner approval
    document.getElementById('form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword =
            document.getElementById('confirmPassword').value;

        if (!/^[A-Za-z0-9._-]{3,30}$/.test(username)) {
            showMessage(
                'Username must be 3-30 characters (letters, numbers, dot, underscore or hyphen).',
                false
            );
            return;
        }

        if (password.length < 6) {
            showMessage('Password must be at least 6 characters.', false);
            return;
        }

        if (password !== confirmPassword) {
            showMessage('Passwords do not match.', false);
            return;
        }

        const submitButton = document.getElementById('submitBtn');

        submitButton.disabled = true;
        submitButton.textContent = 'Please wait...';

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    username: username,
                    password: password,
                    confirmPassword: confirmPassword
                })
            });

            let result = {};

            try {
                result = await response.json();
            } catch (error) {
                result = {};
            }

            if (response.ok && result.success === true) {
                showMessage(
                    result.message ||
                    'Approval request sent successfully. Please wait for owner approval.',
                    true
                );

                document.getElementById('form').reset();

            } else {
                showMessage(
                    result.message || 'Signup request failed. Please try again.',
                    false
                );
            }

        } catch (error) {
            showMessage('Server not reachable. Please try again.', false);

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Sign Up';
        }
    });

    // Animated background lights
    (function() {
        const canvas = document.getElementById('bokeh');
        const ctx = canvas.getContext('2d');

        let width, height, lights = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createLight() {
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                radius: 15 + Math.random() * 65,
                speed: 0.15 + Math.random() * 0.4,
                alpha: 0.04 + Math.random() * 0.12
            };
        }

        function init() {
            resize();
            lights = [];

            for (let i = 0; i < 25; i++) {
                lights.push(createLight());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            lights.forEach(function(light) {
                light.y -= light.speed;

                if (light.y < -light.radius) {
                    light.y = height + light.radius;
                    light.x = Math.random() * width;
                }

                const gradient = ctx.createRadialGradient(
                    light.x, light.y, 0,
                    light.x, light.y, light.radius
                );

                gradient.addColorStop(
                    0,
                    'rgba(255,79,154,' + light.alpha + ')'
                );

                gradient.addColorStop(1, 'rgba(255,79,154,0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(
                    light.x,
                    light.y,
                    light.radius,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);

        init();
        animate();
    })();

    // Active bottom navigation
    (function() {
        const path = location.pathname.replace(/\/+$/, '') || '/';

        document.querySelectorAll('.bottom-nav a').forEach(function(link) {
            const href = link.getAttribute('href');
            link.classList.toggle('active', href === path);
        });
    })();
</script>

</body>
</html>
