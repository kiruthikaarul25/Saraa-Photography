<html xmlns:th="http://www.thymeleaf.org">
<head>

  <link rel="shortcut icon" href="/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos — Saara Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
:root{color-scheme:dark}
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #e91e63;
            --gold-light: #f78fb3;
            --gold-dim: rgba(233,30,99,0.12);
            --gold-border: rgba(233,30,99,0.25);
            --bg:#c2185b;
            --surface:#111111;
            --surface2: #d81b60;
            --surface3: #333333;
            --border: rgba(233,30,99,0.2);
            --text:#ffffff;
            --text-muted:#f2b8d2;
            --text-sub:#f7cfe1;
            --red: #c0392b;
            --green: #1a7a4a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 28px 16px;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 15px;
            font-weight:700;
            color: var(--gold);
            letter-spacing: 0.12em;
            padding: 0 8px 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight:700;
            letter-spacing: 0.04em;
            margin-bottom: 2px;
            transition: all 0.2s;
        }

        .sidebar a:hover { background: var(--gold-dim); color: var(--gold); }
        .sidebar a.active { background: var(--gold-dim); color: var(--gold); border-left: 2px solid var(--gold); }

        .sidebar-logout { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
        .sidebar-logout a { color: #c0392b !important; }
        .sidebar-logout a:hover { background: rgba(192,57,43,0.1) !important; color: #e74c3c !important; }

        /* ── HAMBURGER ── */
        .hamburger {
            display: none;
            position: fixed;
            top: 16px; left: 16px;
            z-index: 200;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--gold);
            width: 40px; height: 40px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99;
        }

        /* ── MAIN ── */
        .main { margin-left: 240px; padding: 40px 36px; min-height: 100vh; }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-back:hover { border-color: var(--gold); color: var(--gold); }

        .page-title {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 20px;
            font-weight:700;
            color: var(--gold);
            letter-spacing: 0.08em;
        }

        /* ── ALERTS ── */
        .alert {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .alert-success { background: rgba(26,122,74,0.12); border: 1px solid rgba(26,122,74,0.3); color: #52c28a; }
        .alert-danger  { background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.3); color: #e07060; }
        .alert i { font-size: 16px; }

        /* ── CLIENT CARD ── */
        .client-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .client-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 20px;
            flex-shrink: 0;
        }

        .client-name {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 15px;
            color: var(--gold-light);
        }

        .client-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .status-badge {
            margin-left: auto;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight:700;
            text-transform: capitalize;
            letter-spacing: 0.08em;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            color: var(--gold);
        }

        /* ── UPLOAD CARD ── */
        .upload-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .card-top-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .card-body { padding: 28px; }

        /* ── FORM ELEMENTS ── */
        .field-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight:700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .field-label i { color: var(--gold); font-size: 14px; }

        .input-wrap {
            position: relative;
            margin-bottom: 24px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 42px;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(233,30,99,0.08);
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0 24px;
        }

        .divider-line { flex: 1; height: 1px; background: var(--border); }
        .divider-label {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ── DROP ZONE ── */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 52px 24px;
            text-align: center;
            background: var(--surface2);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            user-select: none;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            background: var(--gold-dim);
            border-color: var(--gold);
        }

        .drop-icon {
            font-size: 40px;
            color: var(--gold);
            margin-bottom: 14px;
        }

        .drop-title {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 14px;
            color: var(--gold-light);
            margin-bottom: 8px;
            letter-spacing: 0.06em;
        }

        .drop-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── PREVIEW BAR ── */
        .preview-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding: 10px 14px;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .count-text {
            font-size: 13px;
            font-weight:700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn {
            font-size: 12px;
            color: #e07060;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .clear-btn:hover { color: var(--red); }

        /* ── PREVIEW GRID ── */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface3);
            border: 1px solid var(--border);
        }

        .preview-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(0,0,0,0.75);
            color:#fff;
            border: none;
            border-radius: 50%;
            width: 22px; height: 22px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .remove-btn:hover { background: var(--red); }

        .file-name {
            font-size: 10px;
            color: var(--text-muted);
            padding: 4px 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--surface2);
        }

        /* ── PROGRESS ── */
        .progress-wrap { display: none; margin-top: 20px; }

        .progress-track {
            height: 6px;
            border-radius: 6px;
            background: var(--surface3);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 6px;
            width: 100%;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0 }
            100% { background-position: -200% 0 }
        }

        .progress-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 0.06em;
        }

        /* ── SUBMIT BUTTON ── */
        .btn-upload {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 10px;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 13px;
            font-weight:700;
            letter-spacing: 0.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s;
        }

        .btn-upload:hover:not(:disabled) {
            background: var(--gold);
            color:#fff;
        }

        .btn-upload:disabled {
            border-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .hamburger { display: flex; }
            .main { margin-left: 0; padding: 72px 18px 32px; }
        }

        @media (max-width: 480px) {
            .client-card { flex-wrap: wrap; }
            .status-badge { margin-left: 0; }
            .drop-zone { padding: 32px 16px; }
            .card-body { padding: 18px 14px; }
            .preview-grid { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
            .preview-item img { height: 70px; }
        }
    </style>

h1,h2,h3,h4,h5,h6,p,label,small,span,td,th,li,div { }

.brand, .tag, .sidebar-brand h2, .section-title, .page-title, .logo-text,
a:not(.btn):not([class*="button"]) { color:var(--theme-pink-dark) !important; }
button, .btn, input[type="submit"], input[type="button"], .button, a.btn {

}

@keyframes softFadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.card, .box, .panel, .stat-card, .package-card, .client-card { animation:softFadeUp .45s ease both; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

</div>

<!-- Main -->
<div class="main">

    <div class="page-header">
        <a th:href="@{/clients/{id}(id=${clientId})}" href="#" class="btn-back">
            <i class="ti ti-arrow-left"></i> Back
        </a>
        <h1 class="page-title">Upload Photos</h1>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success">
        <i class="ti ti-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="ti ti-alert-circle"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Client info -->
    <div class="client-card">
        <div class="client-avatar"><i class="ti ti-heart"></i></div>
        <div>
            <div class="client-name" th:text="${client != null ? client.coupleName : 'Unknown Client'}">Client Name</div>
            <div class="client-meta" th:text="${client != null ? client.phone : ''}">Phone</div>
        </div>
        <span class="status-badge" th:text="${client != null ? client.status : ''}">pending</span>
    </div>

    <!-- Upload card -->
    <div class="upload-card">
        <div class="card-top-bar"></div>
        <div class="card-body">
            <form th:action="@{/owner/upload}" method="post" enctype="multipart/form-data" id="uploadForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="clientId" th:value="${clientId}"/>

                <!-- Album title -->
                <label class="field-label"><i class="ti ti-folder"></i> Album Title</label>
                <div class="input-wrap">
                    <i class="ti ti-pencil input-icon"></i>
                    <input type="text" name="albumTitle" id="albumTitle" class="form-input"
                           placeholder="e.g. Wedding Day Highlights"
                           th:value="${albumTitle != null ? albumTitle : ''}">
                </div>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-label">Photos</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Drop zone -->
                <div class="drop-zone" id="dropZone">
                    <div class="drop-icon"><i class="ti ti-cloud-upload"></i></div>
                    <div class="drop-title">Click to select photos</div>
                    <div class="drop-hint">or drag &amp; drop here · JPG, PNG, WEBP · Max 20 MB each</div>
                    <input type="file" name="files" id="fileInput"
                           multiple accept="image/jpeg,image/png,image/webp" style="display:none;">
                </div>

                <!-- Preview bar -->
                <div class="preview-bar" id="previewBar">
                    <span class="count-text">
                        <i class="ti ti-photo"></i>
                        <span id="countText">0 photos selected</span>
                    </span>
                    <button type="button" class="clear-btn" id="clearBtn">
                        <i class="ti ti-trash"></i> Clear all
                    </button>
                </div>

                <!-- Preview grid -->
                <div class="preview-grid" id="previewGrid"></div>

                <!-- Progress -->
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-track">
                        <div class="progress-bar" id="progressBar" style="width:0%;animation:none"></div>
                    </div>
                    <div class="progress-text" id="progressText">Uploading photos, please wait…</div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-upload" id="submitBtn" disabled>
                    <i class="ti ti-upload"></i> Upload Photos
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const fileInput    = document.getElementById('fileInput');
    const previewGrid  = document.getElementById('previewGrid');
    const previewBar   = document.getElementById('previewBar');
    const countText    = document.getElementById('countText');
    const submitBtn    = document.getElementById('submitBtn');
    const dropZone     = document.getElementById('dropZone');
    const clearBtn     = document.getElementById('clearBtn');
    const progressWrap = document.getElementById('progressWrap');
    const uploadForm   = document.getElementById('uploadForm');
    let selectedFiles  = [];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

    dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        handleFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
    });

    clearBtn.addEventListener('click', () => { selectedFiles = []; renderPreviews(); syncFileInput(); });

    function handleFiles(files) {
        // fast duplicate check (works for 20,000+ photos)
        const seen = new Set(selectedFiles.map(x => x.name + '|' + x.size));
        files.forEach(f => {
            const key = f.name + '|' + f.size;
            if (!seen.has(key)) { seen.add(key); selectedFiles.push(f); }
        });
        renderPreviews();
        syncFileInput();
    }

    const MAX_PREVIEWS = 60;   // only show first 60 thumbnails (browser stays fast with 1000s of photos)
    let previewUrls = [];

    function renderPreviews() {
        previewUrls.forEach(u => URL.revokeObjectURL(u));
        previewUrls = [];
        previewGrid.innerHTML = '';
        selectedFiles.slice(0, MAX_PREVIEWS).forEach((file, idx) => {
            const url = URL.createObjectURL(file);
            previewUrls.push(url);
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = `<img src="${url}" alt="">
                <button type="button" class="remove-btn" data-idx="${idx}">✕</button>
                <div class="file-name"></div>`;
            item.querySelector('img').alt = file.name;
            item.querySelector('.file-name').textContent = file.name;
            previewGrid.appendChild(item);
        });
        const count = selectedFiles.length;
        previewBar.style.display = count > 0 ? 'flex' : 'none';
        if (count > 0) {
            countText.textContent = `${count} photo${count > 1 ? 's' : ''} selected`
                + (count > MAX_PREVIEWS ? ` (showing first ${MAX_PREVIEWS})` : '');
        }
        submitBtn.disabled = count === 0;
    }

    previewGrid.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-btn')) {
            selectedFiles.splice(parseInt(e.target.dataset.idx), 1);
            renderPreviews(); syncFileInput();
        }
    });

    function syncFileInput() {
        // Upload is done in batches with fetch(), so the file input does not need to hold
        // the files. Just reset it (keeps the page fast with thousands of photos).
        fileInput.value = '';
    }

    // ── Upload in small batches (15 photos / 60 MB at a time) so 1000s of photos work ──
    const BATCH_FILES = 15;
    const BATCH_BYTES = 60 * 1024 * 1024;

    uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!selectedFiles.length) return;

        const bar  = document.getElementById('progressBar');
        const txt  = document.getElementById('progressText');
        const clientId   = uploadForm.querySelector('[name=clientId]').value;
        const albumTitle = document.getElementById('albumTitle').value;
        const csrfEl     = uploadForm.querySelector('input[type=hidden]:not([name=clientId])');

        submitBtn.disabled = true;
        clearBtn.disabled  = true;
        progressWrap.style.display = 'block';
        bar.style.width = '0%';

        // split into batches
        const batches = [];
        let cur = [], curBytes = 0;
        for (const f of selectedFiles) {
            if (cur.length && (cur.length >= BATCH_FILES || curBytes + f.size > BATCH_BYTES)) {
                batches.push(cur); cur = []; curBytes = 0;
            }
            cur.push(f); curBytes += f.size;
        }
        if (cur.length) batches.push(cur);

        const total = selectedFiles.length;
        let done = 0;
        const failed = [];

        for (const batch of batches) {
            let ok = false;
            for (let attempt = 1; attempt <= 3 && !ok; attempt++) {
                try {
                    const fd = new FormData();
                    fd.append('clientId', clientId);
                    fd.append('albumTitle', albumTitle);
                    if (csrfEl && csrfEl.name) fd.append(csrfEl.name, csrfEl.value);
                    batch.forEach(f => fd.append('files', f));
                    // redirect:'manual' -> do not download the big client page after every batch
                    const res = await fetch(uploadForm.action, {
                        method: 'POST', body: fd, credentials: 'same-origin', redirect: 'manual'
                    });
                    ok = res.type === 'opaqueredirect' || res.ok;
                } catch (err) { ok = false; }
                if (!ok) await new Promise(r => setTimeout(r, 1500));
            }
            if (ok) done += batch.length; else failed.push(...batch);
            bar.style.width = Math.round(((done + failed.length) / total) * 100) + '%';
            txt.textContent = `Uploaded ${done} of ${total} photos…` +
                (failed.length ? ` (${failed.length} failed)` : '');
        }

        if (!failed.length) {
            txt.textContent = `All ${total} photos uploaded. Opening client…`;
            window.location.href = '/clients/' + clientId;
        } else {
            selectedFiles = failed;
            renderPreviews(); syncFileInput();
            txt.textContent = `${done} uploaded. ${failed.length} failed - click "Upload Photos" to retry only the failed ones.`;
            submitBtn.disabled = false;
            clearBtn.disabled  = false;
        }
    });

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }
</script>
