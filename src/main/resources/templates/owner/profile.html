<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" href="/favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Saara Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
:root{color-scheme:dark}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;background:#c2185b;color:#ffffff;min-height:100vh;display:flex}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#c2185b;border-right:1px solid rgba(233,30,99,0.1);display:flex;flex-direction:column;z-index:500;transition:transform 0.3s}
        .sidebar-brand{padding:26px 20px 22px;border-bottom:1px solid rgba(233,30,99,0.1);margin-bottom:16px}
        .sidebar-brand h2{font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:1rem;font-weight:700;letter-spacing:3px;color:#e91e63}
        .sidebar-brand p{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:#f2b8d2;margin-top:3px}
        .sidebar-nav{flex:1;padding:0 8px}
        .nav-section{padding:14px 12px 6px;font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:#f2b8d2}
        .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:2px;border-radius:10px;text-decoration:none;color:#ffffff;font-size:0.75rem;letter-spacing:1.5px;text-transform:uppercase;border:1px solid transparent;transition:all 0.25s}
        .nav-item i{font-size:1rem;flex-shrink:0}
        .nav-item:hover,.nav-item.active{color:#e91e63;background:rgba(233,30,99,0.07);border-color:rgba(233,30,99,0.12)}
        .sidebar-footer{padding:16px 8px;border-top:1px solid rgba(233,30,99,0.1)}
        .logout-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#ffffff;text-decoration:none;font-size:0.75rem;letter-spacing:1.5px;text-transform:uppercase;border:1px solid transparent;transition:all 0.25s}
        .logout-btn:hover{color:#e74c3c;background:rgba(231,76,60,0.06);border-color:rgba(231,76,60,0.12)}

        .hamburger{display:none;position:fixed;top:16px;left:16px;z-index:200;background:#c2185b;border:1px solid rgba(233,30,99,0.2);border-radius:8px;color:#e91e63;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem}
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:399}
        .sidebar-overlay.open{display:block}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}
            .sidebar.open{transform:translateX(0)}
            .main{margin-left:0!important;padding:72px 14px 40px}
            .form-card{padding:24px 18px}
        }

        .main{margin-left:220px;flex:1;padding:36px 28px;min-height:100vh}
        .page-top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
        .page-top h4{font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:3px;color:#ffffff}
        .page-top h4 span{color:#e91e63}

        .form-card{background:#111111;border:1px solid rgba(233,30,99,0.15);border-radius:20px;padding:36px 32px;max-width:500px;position:relative;overflow:hidden}
        .form-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(to right,transparent,#e91e63,transparent)}

        .avatar-wrap{display:flex;align-items:center;gap:18px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid rgba(233,30,99,0.08)}
        .avatar{width:68px;height:68px;border-radius:50%;background:rgba(233,30,99,0.1);border:1px solid rgba(233,30,99,0.3);display:flex;align-items:center;justify-content:center;font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:1.6rem;font-weight:700;color:#e91e63;flex-shrink:0}
        .avatar-info h3{font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:2px;color:#ffffff;margin-bottom:4px}
        .avatar-info p{font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:#f2b8d2}

        .section-sep{display:flex;align-items:center;gap:12px;margin:22px 0 18px}
        .section-sep .sep-line{flex:1;height:1px;background:rgba(233,30,99,0.08)}
        .section-sep .sep-label{display:flex;align-items:center;gap:7px;font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;color:#e91e63;white-space:nowrap}
        .section-sep .sep-label i{font-size:0.85rem}
        .field{margin-bottom:18px}
        .field label{display:block;font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:#ffffff;margin-bottom:8px}
        .input-wrap{position:relative}
        .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#f2b8d2;font-size:1rem;pointer-events:none;transition:color 0.3s}
        .input-wrap:focus-within i{color:#e91e63}
        .field input{width:100%;background:#c2185b;border:1px solid rgba(233,30,99,0.12);border-radius:12px;padding:13px 16px 13px 42px;color:#ffffff;font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:0.88rem;font-weight:700;outline:none;transition:border-color 0.3s}
        .field input::placeholder{color:#d79ab7}
        .field input:focus{border-color:rgba(233,30,99,0.45)}
        .field input[readonly]{color:#f2b8d2;cursor:not-allowed;border-color: rgba(233,30,99,.25)}
        .field input[readonly]:focus{border-color: rgba(233,30,99,.25)}
        .readonly-hint{font-size:0.65rem;color:#d79ab7;margin-top:5px;letter-spacing:0.5px}

        .btn-save{width:100%;margin-top:8px;padding:14px;background:transparent;border:1px solid rgba(233,30,99,0.45);color:#e91e63;border-radius:40px;cursor:pointer;font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;font-size:0.78rem;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.35s}
        .btn-save:hover{background:#e91e63;color:#fff;border-color:#e91e63}
        .btn-save i{font-size:1rem}

        /* ── MOBILE TOP BAR ── */
        .mobile-topbar {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 400;
            height: 56px;
            background: rgba(17,17,17,.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(233,30,99,0.15);
            align-items: center;
            padding: 0 14px;
            gap: 12px;
        }
        .mobile-topbar-btn {
            background: transparent;
            border: 1px solid rgba(233,30,99,0.25);
            border-radius: 8px;
            color: #e91e63;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
        }
        .mobile-topbar-title {
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            font-size: 0.88rem; letter-spacing: 2px; color: #e91e63;
        }
        .mobile-topbar-title span { color:#ffffff; }
        @media(max-width:768px) { .mobile-topbar { display: flex; } }

        /* Small phones: let avatar block wrap gracefully, tighten spacing */
        @media (max-width: 380px) {
            .avatar-wrap { flex-wrap: wrap; gap: 12px; }
            .form-card { padding: 20px 14px; border-radius: 16px; }
            .main { padding: 64px 10px 36px; }
        }

        /* Tablet: sidebar stays, but give the form a touch more room */
        @media (min-width: 769px) and (max-width: 1024px) {
            .main { padding: 32px 22px; }
            .form-card { max-width: 460px; }
        }
    </style>
<link rel="stylesheet" href="/css/site-nav.css">
<style id="saara-theme">body{font-weight: 400}button,input,select,textarea{font-family:inherit;font-weight:700}.bottom-nav{background:rgba(17,17,17,.95)!important;border-top:1px solid rgba(233,30,99,.25)!important}.bottom-nav ul li a{color:#ffffff!important;font-family:inherit!important;font-weight:700}.bottom-nav ul li a:hover,.bottom-nav ul li a.active{color:#e91e63!important}</style>

<style id="pink-theme">
/* ===== Medium dark pink + white + black theme ===== */
:root{--pink-main:#e91e63;--pink-dark:#ad1457;--pink-deep:#c2185b;--black:#111111}
html,body{font-family:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif !important}
button,input,select,textarea{font-family:inherit !important}
.card,.form-card,.pkg-card,.photo-card,.action-card,.mob-client-card,.insta-item,.photo-item,.preview-item,.album-header,.drop-zone,.item{box-shadow:0 6px 18px rgba(0,0,0,.28)}
.sidebar{box-shadow:4px 0 18px rgba(0,0,0,.35)}
.bottom-nav{box-shadow:0 -4px 16px rgba(0,0,0,.3)}
button,.btn-save,.btn-add,.btn-copy,.btn-back,.back-btn,.submit,.logout-btn,.sidebar-logout{box-shadow:0 4px 12px rgba(0,0,0,.3)}
input,select,textarea{box-shadow:0 2px 6px rgba(0,0,0,.18)}
.btn-back,.back-btn{background:var(--black) !important;color:#fff !important;border:1px solid var(--black) !important}
.btn-back:hover,.back-btn:hover{background:var(--pink-main) !important;border-color:var(--pink-main) !important}
.section-sep{border-color:var(--black) !important}
.card,.form-card,.pkg-card,.photo-card,.action-card{border-top:4px solid var(--black)}

/* dark pages: pink background, black cards, white headings */
.main h1,.main h1 span,.page-title,.page-title span,.main>.section-label,.main>.page-top *,.page-header *,.main>h2,.main>p{color:#fff !important}
.main .section-label,.main .section-title{color:#fff !important}
.sidebar{background:#111111 !important;border-right:3px solid var(--pink-main)}
.album-header{background:#111111 !important}
.album-header *{color:#fff !important}
.album-header .badge,.album-header [class*=count]{color:#fff !important}
</style>

<style id="pink-white-theme-overrides">
:root { color-scheme: light !important; --theme-pink:#d95791; --theme-pink-dark:#c94480; --theme-pink-light:#f7dce8; --theme-white:#ffffff; --theme-black:#171317; --theme-muted:#6f6269; --theme-border:#efd0dd; }
html { color-scheme: light !important; }
body { background:#fff !important; color:var(--theme-black) !important; }
body::before { opacity:.025 !important; }
header, nav, aside, .sidebar, .topbar, .navbar, .header, .side-nav, .mobile-nav {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:var(--theme-border) !important;
}
main, .main, .content, .main-content, .page-content, .workspace, .container, .wrap {
  color:var(--theme-black);
}
.card, .box, .panel, .modal, .form-card, .stat-card, .table-wrap, .content-card,
.package-card, .client-card, .upload-card, .success-card, .login-card {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:var(--theme-border) !important;
  box-shadow:0 5px 18px rgba(190,75,125,.10) !important;
  transition:box-shadow .25s ease, transform .25s ease, border-color .25s ease;
}
.card:hover, .box:hover, .panel:hover, .stat-card:hover, .package-card:hover, .client-card:hover {
  box-shadow:0 8px 22px rgba(190,75,125,.15) !important;
  border-color:#e7a9c4 !important;
}
h1,h2,h3,h4,h5,h6,p,label,small,span,td,th,li,div { }
h1,h2,h3,h4,h5,h6,p,label,td,th { color:inherit; }
.brand, .tag, .sidebar-brand h2, .section-title, .page-title, .logo-text,
a:not(.btn):not([class*="button"]) { color:var(--theme-pink-dark) !important; }
button, .btn, input[type="submit"], input[type="button"], .button, a.btn {
  background:var(--theme-pink) !important; color:#fff !important;
  border-color:var(--theme-pink) !important;
  box-shadow:0 3px 10px rgba(217,87,145,.16) !important;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
button:hover, .btn:hover, input[type="submit"]:hover, input[type="button"]:hover, .button:hover {
  background:var(--theme-pink-dark) !important; transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(217,87,145,.22) !important;
}
input, select, textarea {
  background:#fff !important; color:var(--theme-black) !important;
  border-color:#e8c5d5 !important;
}
input::placeholder, textarea::placeholder { color:#a99aa1 !important; }
table th { background:var(--theme-pink-light) !important; color:#39232e !important; }
table td { color:var(--theme-black) !important; border-color:#f0dce5 !important; }
hr, .divider { border-color:var(--theme-border) !important; }
.badge, .pill, .status { border-color:#edc4d6 !important; }
@keyframes softFadeUp { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.card, .box, .panel, .stat-card, .package-card, .client-card { animation:softFadeUp .45s ease both; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
<style id="dark-pink-white-theme">
:root{--bg:#ffffff!important;--surface:#ffffff!important;--soft:#fff3f7!important;--text:#171317!important;--muted:#765b68!important;--pink:#c2185b!important;--pink-main:#c2185b!important;--pink-dark:#880e4f!important;--pink-deep:#ad1457!important;--theme-pink:#c2185b!important;--theme-pink-dark:#880e4f!important;--theme-pink-light:#fff0f5!important;--theme-white:#fff!important;--theme-black:#171317!important;--theme-muted:#765b68!important;--theme-border:#f0bfd2!important}
html,body{background:#fff!important;color:#171317!important;color-scheme:light!important}
body{font-weight:400!important}
/* White surfaces; dark pink is the only strong theme colour. */
.sidebar,.main,.card,.table-card,.table-wrapper,.ph,.ph-body,.panel,.form-card,.content-card,.modal-content,.stat-card,.dashboard-card,.section-card,.album-header,.row,.client-card,.package-card,.profile-card,.upload-card,.gallery-card,.auth-card,.login-card,.form-container,.page-card{background:#fff!important;color:#171317!important;border-color:#f0bfd2!important;box-shadow:0 5px 18px rgba(136,14,79,.08)!important}
.sidebar{border-right:1px solid #f0bfd2!important}
.sidebar-brand,.sidebar-footer{border-color:#f0bfd2!important}
.sidebar-brand h2,.page-top h4 span,.card-label,.nav-section,.section-title,.section-label,.ph-body label,.cat-label{color:#c2185b!important}
.nav-item,.logout-btn,.sidebar-nav a{color:#171317!important}
.nav-item:hover,.nav-item.active,.logout-btn:hover,.sidebar-nav a:hover{background:#fff0f5!important;color:#171317!important;border-color:#c2185b!important}
input,select,textarea,.sel,.ph-body input[type=text],.ph-body select{background:#fff!important;color:#171317!important;border:1px solid #e8b2c8!important}
input::placeholder,textarea::placeholder{color:#987b88!important}
button,.btn,.btn-primary,.btn-add,.save-btn,.action-btn{background:#c2185b!important;color:#fff!important;border-color:#c2185b!important;transition:all .22s ease!important}
button:hover,.btn:hover,.btn-primary:hover,.btn-add:hover,.save-btn:hover,.action-btn:hover{background:#171317!important;color:#fff!important;border-color:#171317!important;transform:translateY(-1px)}
.btn.del,.btn-delete,.delete-btn{background:#c2185b!important;color:#fff!important;border-color:#c2185b!important}
.btn.del:hover,.btn-delete:hover,.delete-btn:hover{background:#171317!important;color:#fff!important;border-color:#171317!important}
.file-pick{background:#fff5f8!important;color:#c2185b!important;border-color:#c2185b!important}
.file-pick:hover{background:#171317!important;color:#fff!important;border-color:#171317!important}
.tag,.badge,.status-badge{background:#c2185b!important;color:#fff!important}
hr{border-color:#f0bfd2!important}
.card,.ph,.table-card{border-radius:16px!important}
.ph{overflow:hidden!important}
.ph-body{color:#171317!important}
/* Keep status colours legible while preventing dark panels. */
.msg{background:#f0fff4!important;color:#236b3b!important}
</style>
</head>
<body>
<!-- MOBILE TOP BAR -->
<div class="mobile-topbar">
    <button class="mobile-topbar-btn" id="mobMenuBtn" onclick="toggleSidebar()">
        <i class="ti ti-menu-2" id="mobMenuIcon"></i>
    </button>
    <span class="mobile-topbar-title">My <span>Profile</span></span>
</div>


<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><h2>Saara Photography</h2><p>Admin Panel</p></div>
    <nav class="sidebar-nav">
        <div class="nav-section">Main</div>
      
        <a th:href="@{/clients}" class="nav-item"><i class="ti ti-users"></i>Clients</a>
        <div class="nav-section">Business</div>
        <a th:href="@{/owner/home-photos}" class="nav-item"><i class="ti ti-photo-star"></i>Work Photos</a>
        <a th:href="@{/owner/packages}" class="nav-item"><i class="ti ti-diamond"></i>Packages</a>

        <a th:href="@{/owner/profile}" class="nav-item active"><i class="ti ti-user-circle"></i>Profile</a>
    <a th:href="@{/admin/contact-enquiries}" class="nav-item"><i class="ti ti-mail"></i>Contact Enquiries</a>
        </nav>
    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="logout-btn"><i class="ti ti-logout"></i>Logout</a>
    </div>
</aside>

<div class="main">
    <div class="page-top">
        <h4>My <span>Profile</span></h4>
    </div>

    <div class="form-card">
        <div class="avatar-wrap">
            <div class="avatar" th:text="${#strings.substring(owner.name, 0, 1)}">A</div>
            <div class="avatar-info">
                <h3 th:text="${owner.name}">Owner Name</h3>
                <p th:text="${owner.studioName != null} ? ${owner.studioName} : 'Saara Photography'">Studio Name</p>
            </div>
        </div>

        <form th:action="@{/owner/profile}" th:object="${owner}" method="post">
            <div class="section-sep">
                <div class="sep-line"></div>
                <div class="sep-label"><i class="ti ti-user"></i>Personal Info</div>
                <div class="sep-line"></div>
            </div>
            <div class="field">
                <label>Full Name</label>
                <div class="input-wrap">
                    <input type="text" th:field="*{name}" placeholder="Your full name" required>
                    <i class="ti ti-user"></i>
                </div>
            </div>
            <div class="field">
                <label>Studio Name</label>
                <div class="input-wrap">
                    <input type="text" th:field="*{studioName}" placeholder="Saara Photography">
                    <i class="ti ti-camera"></i>
                </div>
            </div>
            <div class="section-sep">
                <div class="sep-line"></div>
                <div class="sep-label"><i class="ti ti-address-book"></i>Contact</div>
                <div class="sep-line"></div>
            </div>
            <div class="field">
                <label>Email</label>
                <div class="input-wrap">
                    <input type="email" th:field="*{email}" readonly>
                    <i class="ti ti-mail"></i>
                </div>
                <div class="readonly-hint">Email cannot be changed</div>
            </div>
            <div class="field">
                <label>Phone</label>
                <div class="input-wrap">
                    <input type="text" th:field="*{phone}" placeholder="+91 97867 11698">
                    <i class="ti ti-phone"></i>
                </div>
            </div>
            <button type="submit" class="btn-save">
                <i class="ti ti-device-floppy"></i>Save Changes
            </button>
        </form>
    </div>
</div>

<script>
    
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const icon = document.getElementById('mobMenuIcon');
        const isOpen = sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
        if (icon) icon.className = isOpen ? 'ti ti-x' : 'ti ti-menu-2';
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) toggleSidebar();
        }
    });
</script>


<nav class="bottom-nav">
    <ul>
        <li><a href="/"><i class="ti ti-home"></i><span>Home</span></a></li>
        <li><a href="/work"><i class="ti ti-video"></i><span>Work</span></a></li>
        <li><a href="/select"><i class="ti ti-photo"></i><span>Select</span></a></li>
        <li><a href="/packages-page"><i class="ti ti-diamond"></i><span>Packages</span></a></li>
        <li><a href="/contact"><i class="ti ti-phone"></i><span>Contact</span></a></li>
    </ul>
</nav>

<script src="/js/constants.js"></script>

</div>

</body>
