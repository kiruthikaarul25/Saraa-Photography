<style>

/* ============ CLAYMORPHISM · dark / light (nav pink in light, center white) ============ */

:root,html[data-theme="dark"]{

 --k-pink:#ff4d94;--k-pink2:#ff7ab3;--k-deep:#d92a76;

 --k-bg:#0c0809;--k-bar:#17101a;--k-card:#1c1420;--k-field:#150e18;

 --k-text:#fbeef4;--k-sub:#c9aebb;--k-muted:#8a7280;--k-line:rgba(255,255,255,.08);

 --k-bartext:#c9aebb;--k-barhover:#1c1420;

 --k-out:10px 10px 24px rgba(0,0,0,.65),-6px -6px 16px rgba(255,255,255,.045);

 --k-outsm:6px 6px 14px rgba(0,0,0,.6),-4px -4px 10px rgba(255,255,255,.04);

 --k-in:inset 4px 4px 10px rgba(0,0,0,.6),inset -3px -3px 8px rgba(255,255,255,.04);

 --k-btn:8px 8px 20px rgba(255,77,148,.32),inset -4px -4px 10px rgba(180,20,90,.55),inset 4px 4px 10px rgba(255,160,205,.55);

 --k-barshadow:var(--k-out);--k-glowa:rgba(255,77,148,.14);--k-glowb:rgba(255,77,148,.10);

}

html[data-theme="light"]{

 --k-pink:#ff3d8b;

 --k-bg:#ffffff;

 --k-bar:linear-gradient(165deg,#ff8fc0 0%,#ff4d94 55%,#e0307a 100%);

 --k-card:#ffffff;--k-field:#fff3f8;

 --k-text:#3b1d2c;--k-sub:#7d5568;--k-muted:#b48a9c;--k-line:rgba(255,61,139,.14);

 --k-bartext:#ffffff;--k-barhover:rgba(255,255,255,.22);

 --k-out:10px 10px 26px rgba(214,120,160,.30),-8px -8px 20px rgba(255,255,255,.95);

 --k-outsm:6px 6px 14px rgba(214,120,160,.26),-5px -5px 12px rgba(255,255,255,.95);

 --k-in:inset 4px 4px 10px rgba(214,120,160,.22),inset -4px -4px 10px rgba(255,255,255,.95);

 --k-btn:8px 8px 20px rgba(255,61,139,.34),inset -4px -4px 10px rgba(200,30,100,.45),inset 4px 4px 10px rgba(255,170,210,.7);

 --k-barshadow:12px 12px 28px rgba(255,61,139,.35),inset -5px -5px 12px rgba(190,25,95,.35),inset 5px 5px 12px rgba(255,190,220,.55);

 --k-glowa:rgba(255,61,139,.06);--k-glowb:rgba(255,61,139,.05);

}

:root{--k-r:20px}



/* ============ TOP NAV (same on every page) ============ */

.ss-nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 24px));height:58px;z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;

 border-radius:var(--k-r);background:var(--k-bar);box-shadow:var(--k-barshadow);font-family:'Poppins','Segoe UI',sans-serif;box-sizing:border-box}

.ss-nav *{box-sizing:border-box}

html body .ss-nav a.ss-brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0;overflow:hidden;color:var(--k-text)!important}

html[data-theme="light"] body .ss-nav a.ss-brand{color:#fff!important}

.ss-logo{position:relative;width:34px;height:34px;border-radius:12px;overflow:hidden;flex-shrink:0;display:block}

.ss-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0!important;opacity:1!important;filter:none!important;box-shadow:none!important;transform:none!important}

.ss-bt{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ss-links{display:flex;align-items:center;gap:6px}

html body .ss-nav .ss-links a{position:relative;overflow:hidden;padding:9px 14px;border-radius:16px;text-decoration:none;white-space:nowrap;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;

 color:var(--k-bartext)!important;background:transparent!important;border:0!important;box-shadow:none!important;transition:all .2s;transform:none!important;opacity:1!important}

html body .ss-nav .ss-links a:hover{color:var(--k-pink)!important;background:var(--k-barhover)!important}

html[data-theme="light"] body .ss-nav .ss-links a:hover{color:#fff!important}

html body .ss-nav .ss-links a.on{color:#fff!important;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important}

html[data-theme="light"] body .ss-nav .ss-links a.on{color:var(--k-pink)!important;background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}

html body .ss-nav a.ss-cta{padding:10px 16px;border-radius:16px;text-decoration:none;white-space:nowrap;color:#fff!important;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;

 background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important;border:0!important}

html[data-theme="light"] body .ss-nav a.ss-cta{color:var(--k-pink)!important;background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}

html body .ss-nav .ss-ic{width:40px!important;height:40px!important;border-radius:15px!important;border:0!important;cursor:pointer;padding:0!important;flex-shrink:0;display:flex!important;align-items:center;justify-content:center;

 color:var(--k-pink)!important;background:var(--k-card)!important;box-shadow:var(--k-outsm)!important;position:static!important;transform:none!important;filter:none!important}

html[data-theme="light"] body .ss-nav .ss-ic{background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}

.ss-ic svg{width:19px;height:19px}

html[data-theme="dark"] .ss-moon,html[data-theme="light"] .ss-sun{display:none!important}

html body .ss-nav .ss-burger{display:none!important}

html body a.ss-ig{position:fixed!important;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:20px;display:flex!important;align-items:center;justify-content:center;z-index:2147482000;

 text-decoration:none;color:#fff!important;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important;transition:transform .2s;border:0!important;opacity:1!important}

html body a.ss-ig svg{width:25px;height:25px}

html body a.ss-ig:hover{transform:translateY(-3px)}

html body a.ss-ig:active{transform:scale(.95)}

.ss-ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);background:rgba(255,77,148,.35);animation:ssRip .6s ease-out forwards}

html[data-theme="light"] .ss-ripple{background:rgba(255,255,255,.55)}

html[data-theme="light"] .ss-links a.on .ss-ripple{background:rgba(255,61,139,.3)}

@keyframes ssRip{to{transform:scale(1);opacity:0}}

@keyframes ssPop{0%{transform:scale(1)}40%{transform:scale(.94)}70%{transform:scale(1.03)}100%{transform:scale(1)}}

html body .ss-links a.pop{animation:ssPop .35s ease!important}

@media(max-width:900px){

 html body .ss-nav a.ss-cta{display:none}

 html body .ss-nav .ss-burger{display:flex!important}

 html body .ss-nav .ss-links{position:absolute;top:66px;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;padding:12px;border-radius:var(--k-r);background:var(--k-bar);box-shadow:var(--k-barshadow);display:none}

 html body .ss-nav .ss-links.open{display:flex}

 html body .ss-nav .ss-links a{padding:13px 16px;font-size:12px}

}

@media(max-width:480px){

 html body a.ss-ig{right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:18px}

 .ss-bt{font-size:11.5px;letter-spacing:.08em}

 html[data-theme] body{padding-top:84px!important}

}





*{margin:0;padding:0;box-sizing:border-box}

html{background:var(--k-bg);min-height:100%}

a{color:inherit;text-decoration:none}

body{font-family:'Poppins','DM Sans',system-ui,sans-serif;color:var(--k-text);min-height:100vh;overflow-x:hidden;padding:96px 16px 16px;background:radial-gradient(600px 420px at 90% -5%,var(--k-glowa),transparent 70%),radial-gradient(560px 420px at 5% 105%,var(--k-glowb),transparent 70%),var(--k-bg);background-attachment:fixed;transition:background .3s,color .3s}



.wrap{max-width:1380px;margin:0 auto;height:calc(100vh - 112px);min-height:560px;display:grid;grid-template-columns:46% 1fr;gap:18px}



/* ---- LEFT: PHOTOS + CLAY FRAMES ---- */

.photo{position:relative;container-type:size;border-radius:var(--k-r);overflow:hidden;background:var(--k-card);box-shadow:var(--k-out)}

.slide{position:absolute;inset:0;background-size:cover;background-position:50% 30%;opacity:0;transform:scale(1.04);transition:opacity 1.2s ease,transform 7s ease-out}

.slide.on{opacity:1;transform:scale(1.12)}

.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,10,20,0) 45%,rgba(30,10,20,.6) 100%);pointer-events:none}

.frame{position:absolute;z-index:3;aspect-ratio:4/5;padding:7px;background:var(--k-card);border-radius:var(--k-r);box-shadow:var(--k-out)}

html[data-theme="light"] .frame{background:#fff}

.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:14px;background:var(--k-field)}

.f1{left:5cqw;top:4cqh;width:25cqh;transform:rotate(-4deg);z-index:3}

.f2{left:28cqw;top:22cqh;width:27cqh;transform:rotate(3deg);z-index:4}

.f3{left:9cqw;top:44cqh;width:28cqh;transform:rotate(-2.5deg);z-index:5}

.hey{position:absolute;left:28px;bottom:26px;z-index:3;color:#fff;font-weight:800;font-size:clamp(38px,7cqh,64px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(60,20,30,.45)}

.hey span{color:#ffd0e3}

.dots{position:absolute;right:24px;bottom:30px;z-index:3;display:flex;gap:7px}

.dots button{width:9px;height:9px;border:0;border-radius:99px;background:rgba(255,255,255,.5);cursor:pointer;padding:0;transition:width .3s,background .3s}

.dots button.on{width:26px;background:#fff}



/* ---- RIGHT: PACKAGES ---- */

.right{border-radius:var(--k-r);background:var(--k-card);box-shadow:var(--k-out);overflow-y:auto;overflow-x:hidden;padding:30px clamp(18px,3vw,36px) 84px;scrollbar-width:thin;scrollbar-color:var(--k-pink2) transparent}

.head{text-align:center;padding:4px 6px 26px}

.head small{display:block;font-size:11px;font-weight:600;letter-spacing:6px;text-transform:uppercase;color:var(--k-pink);margin-bottom:10px}

.head h1{font-weight:800;font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:-.02em}

.head h1 span{color:var(--k-pink)}

.head p{color:var(--k-sub);font-size:14px;margin:12px auto 0;max-width:430px;line-height:1.7}

.head::after{content:"";display:block;width:44px;height:6px;border-radius:6px;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));margin:20px auto 0}



.list{display:flex;flex-direction:column;gap:26px}

.pc{position:relative;padding:26px 26px 24px;border-radius:var(--k-r);background:var(--k-card);box-shadow:var(--k-out);transition:transform .3s}

html[data-theme="dark"] .pc{background:var(--k-bar)}

.pc:hover{transform:translateY(-4px)}

.pc.feat{background:linear-gradient(165deg,#ff8fc0 0%,#ff4d94 55%,#e0307a 100%)!important;color:#fff;

 box-shadow:12px 12px 28px rgba(255,61,139,.35),inset -6px -6px 16px rgba(190,25,95,.4),inset 6px 6px 16px rgba(255,190,220,.45)}

.badge{position:absolute;top:-13px;left:24px;padding:6px 16px;border-radius:var(--k-r);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));box-shadow:var(--k-btn)}

.pc.feat .badge{background:#fff;color:var(--k-pink);box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)}

.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}

.pc h3{font-size:21px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}

.price{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--k-pink);white-space:nowrap;text-align:right;line-height:1.1}

.price small{display:block;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--k-muted);margin-top:4px}

.pc.feat .price,.pc.feat .price small,.pc.feat h3{color:#fff}

.pc.feat .price small{opacity:.85}

.pd{margin:12px 0 16px;font-size:13px;line-height:1.8;color:var(--k-sub);overflow-wrap:anywhere}

.pc.feat .pd{color:#ffe9f1}

.pc ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:22px}

.pc li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--k-sub);line-height:1.4}

.pc.feat li{color:#fff}

.pc li i{width:26px;height:26px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:var(--k-pink);background:var(--k-field);box-shadow:var(--k-in)}

.pc.feat li i{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 2px 2px 6px rgba(190,25,95,.35),inset -2px -2px 6px rgba(255,200,225,.35)}

.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:var(--k-r);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;

 background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));box-shadow:var(--k-btn);transition:transform .25s,filter .25s}

.go:hover{transform:translateY(-3px);filter:brightness(1.07)}

.go:active{transform:translateY(0)}

.pc.feat .go{background:#fff;color:var(--k-pink);box-shadow:6px 6px 14px rgba(190,25,95,.35),-3px -3px 8px rgba(255,200,225,.5)}

.empty{text-align:center;padding:50px;border-radius:var(--k-r);background:var(--k-field);box-shadow:var(--k-in);color:var(--k-muted);font-size:14px}



@media(max-width:900px){

 .wrap{height:auto;display:flex;flex-direction:column}

 .photo{height:600px;flex:none}

 .right{overflow:visible;padding-bottom:90px}

 .pc ul{grid-template-columns:1fr}

}

@media(max-width:480px){body{padding:84px 12px 12px}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}.slide{transform:none!important}}

</style>

<script>

/* View-only page. Add / edit / delete of packages is done ONLY in the admin panel (/owner/packages). */

var API='/api/packages';

/* Left-side photos (already in static/images). Edit this list to change them. */

var PHOTOS=['/images/saara-03.jpg','/images/saara-05.jpg','/images/saara-10.jpg','/images/saara-18.jpg','/images/saara-19.jpg','/images/wall6.jpg','/images/saara-04.jpg'];

var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

var inr=function(n){return '\u20B9'+Number(n).toLocaleString('en-IN')};



async function load(){

 var list=[];

 try{var r=await fetch(API,{cache:'no-store'});list=r.ok?await r.json():[];}catch(e){list=[];}
  // Hide only the legacy hardcoded Wedding package priced at ₹1,00,000.
  list=list.filter(function(p){return !(String(p.name||'').trim().toLowerCase()==='wedding' && Number(p.price)===100000);});

 var g=document.getElementById('grid');

 if(!list.length){g.innerHTML='<p class="empty">No packages yet.</p>';return;}

 g.innerHTML=list.map(function(p){

  return '<article class="pc'+(p.featured?' feat':'')+'">'+(p.featured?'<span class="badge">Most Popular</span>':'')+

   '<div class="ph"><h3>'+esc(p.name)+'</h3><div class="price">'+inr(p.price)+'<small>Onwards</small></div></div>'+

   '<p class="pd">'+esc(p.description)+'</p><ul>'+(p.features||[]).map(function(f){return '<li><i class="ti ti-check"></i><span>'+esc(f)+'</span></li>'}).join('')+'</ul>'+

   '<a class="go" href="/contact">Enquire Now <i class="ti ti-arrow-right"></i></a></article>';

 }).join('');

 if(!reduce&&document.documentElement.animate){

  document.querySelectorAll('.pc').forEach(function(c,i){c.animate([{opacity:0,transform:'translateY(34px)'},{opacity:1,transform:'none'}],{duration:800,delay:300+i*160,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'});});

 }

}



/* photo slideshow + frames */

var ph=document.getElementById('photo'),dots=document.getElementById('dots'),slides=[],cur=0,timer;

PHOTOS.forEach(function(src,i){

 var d=document.createElement('div');d.className='slide';d.style.backgroundImage="url('"+src+"')";ph.insertBefore(d,ph.firstChild);slides.push(d);

 var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Photo '+(i+1));b.onclick=function(){show(i);restart();};dots.appendChild(b);

});

var fr=[].slice.call(document.querySelectorAll('.frame img'));

function frames(){fr.forEach(function(im,k){var s=PHOTOS[(cur+1+k)%PHOTOS.length];if(im.getAttribute('src')===s)return;im.setAttribute('src',s);if(im.animate&&!reduce)im.animate([{opacity:0},{opacity:1}],{duration:700});});}

function show(i){cur=i;frames();slides.forEach(function(s,k){s.classList.toggle('on',k===i)});[].forEach.call(dots.children,function(b,k){b.classList.toggle('on',k===i)});}

function restart(){clearInterval(timer);timer=setInterval(function(){show((cur+1)%slides.length)},4500);}

show(0);restart();

if(!reduce&&document.documentElement.animate){

<script id="top-nav-js">

(function(){

  var root=document.documentElement;

  document.getElementById('ssTheme').addEventListener('click',function(){

    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';

    root.setAttribute('data-theme',n);root.dataset.theme=n;

    try{localStorage.setItem('saara-theme',n);}catch(e){}

    var tt=document.getElementById('tt');if(tt)tt.textContent=n==='light'?'\u263E':'\u2600';

  });

  var b=document.getElementById('ssBurger'),l=document.getElementById('ssLinks');

  b.addEventListener('click',function(){var o=l.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');});

  var p=location.pathname.replace(/\/+$/,'')||'/';

  l.querySelectorAll('a').forEach(function(a){

    if(a.getAttribute('href')===p)a.classList.add('on');

    a.addEventListener('click',function(e){

      var href=a.getAttribute('href'),r=a.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement('span');

      s.className='ss-ripple';s.style.width=s.style.height=d+'px';s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';

      a.appendChild(s);a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop');

      setTimeout(function(){s.remove();a.classList.remove('pop');},600);

      if(!href||href.charAt(0)==='#'||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;

      e.preventDefault();setTimeout(function(){location.href=href;},260);

    });

  });

})();

</script>

<script src="/js/saara-nav.js"></script>
