<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Gallery — Saara Photography</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('saara-theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) {}
        })();
    </script>
    <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ═════════ THEME TOKENS ═════════ */
:root, [data-theme="dark"] {
    --pink: #ff4d94; --pink-2: #ff7ab3; --pink-deep: #d92a76;
    --bg: #0c0809; --side: #17101a; --card: #1c1420; --field: #150e18;
    --text: #fbeef4; --sub: #c9aebb; --muted: #8a7280;
    --side-text: #c9aebb; --side-muted: #8a7280; --side-hover: #1c1420;
    --line: rgba(255,255,255,.08);
    --out: 10px 10px 24px rgba(0,0,0,.65), -6px -6px 16px rgba(255,255,255,.045);
    --out-sm: 6px 6px 14px rgba(0,0,0,.6), -4px -4px 10px rgba(255,255,255,.04);
    --in: inset 4px 4px 10px rgba(0,0,0,.6), inset -3px -3px 8px rgba(255,255,255,.04);
    --btn: 8px 8px 20px rgba(255,77,148,.32), inset -4px -4px 10px rgba(180,20,90,.55), inset 4px 4px 10px rgba(255,160,205,.55);
    --side-shadow: var(--out);
    --glow-a: rgba(255,77,148,.14); --glow-b: rgba(255,77,148,.10);
    --danger: #ff6b81; --ok: #3ccf82;
}
[data-theme="light"] {
    --pink: #ff3d8b; --pink-2: #ff7ab3; --pink-deep: #d92a76;
    --bg: #ffffff;
    --side: linear-gradient(165deg, #ff8fc0 0%, #ff4d94 55%, #e0307a 100%);
    --card: #ffffff; --field: #fff3f8;
    --text: #3b1d2c; --sub: #7d5568; --muted: #b48a9c;
    --side-text: #ffffff; --side-muted: rgba(255,255,255,.75); --side-hover: rgba(255,255,255,.18);
    --line: rgba(255,61,139,.14);
    --out: 10px 10px 26px rgba(214,120,160,.30), -8px -8px 20px rgba(255,255,255,.95);
    --out-sm: 6px 6px 14px rgba(214,120,160,.26), -5px -5px 12px rgba(255,255,255,.95);
    --in: inset 4px 4px 10px rgba(214,120,160,.22), inset -4px -4px 10px rgba(255,255,255,.95);
    --btn: 8px 8px 20px rgba(255,61,139,.34), inset -4px -4px 10px rgba(200,30,100,.45), inset 4px 4px 10px rgba(255,170,210,.7);
    --side-shadow: 12px 12px 28px rgba(255,61,139,.35), inset -5px -5px 12px rgba(190,25,95,.35), inset 5px 5px 12px rgba(255,190,220,.55);
    --glow-a: rgba(255,61,139,.08); --glow-b: rgba(255,61,139,.06);
    --danger: #d63a57; --ok: #1f9d5c;
}
:root { --r: 20px; }

html { background: var(--bg); transition: background .3s; }
body {
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    color: var(--text); min-height: 100vh; padding-top: 84px;
    background:
        radial-gradient(600px 420px at 90% -5%, var(--glow-a), transparent 70%),
        radial-gradient(560px 420px at 5% 105%, var(--glow-b), transparent 70%),
        var(--bg);
    background-attachment: fixed;
    transition: background .3s, color .3s;
}
button, input, textarea { font-family: inherit; }

/* ═════════ TOP NAV ═════════ */
.ss-nav {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    width: min(1180px, calc(100% - 24px)); height: 58px; z-index: 1000;
    display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px;
    border-radius: var(--r); background: var(--card); box-shadow: var(--out);
}
.ss-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; min-width: 0; overflow: hidden; }
.ss-logo { position: relative; width: 34px; height: 34px; border-radius: 12px; overflow: hidden; flex-shrink: 0; display: block; }
.ss-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ss-bt { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-links { display: flex; align-items: center; gap: 6px; }
.ss-links a {
    padding: 9px 14px; border-radius: 16px; text-decoration: none; font-size: 11.5px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--sub); transition: all .2s; white-space: nowrap;
}
.ss-links a:hover { color: var(--pink); background: var(--card); box-shadow: var(--out-sm); }
.ss-links a.on { color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); }
.ss-cta {
    padding: 10px 16px; border-radius: 16px; text-decoration: none; font-size: 11px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: #fff; white-space: nowrap;
    background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
}
.ss-ic {
    width: 40px; height: 40px; border-radius: 15px; border: 0; cursor: pointer; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--pink);
    background: var(--card); box-shadow: var(--out-sm); text-decoration: none;
}
.ss-ic svg { width: 19px; height: 19px; }
.ss-ic:active { box-shadow: var(--in); }
[data-theme="dark"] .ss-moon, [data-theme="light"] .ss-sun { display: none; }
.ss-burger { display: none; }

.ss-ig {
    position: fixed; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 1100;
    width: 52px; height: 52px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    color: #fff; text-decoration: none; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); transition: transform .2s;
}
.ss-ig svg { width: 25px; height: 25px; }
.ss-ig:hover { transform: translateY(-3px); }
.ss-ig:active { transform: scale(.95); }

/* ═════════ SIDEBAR ═════════ */
.sidebar {
    position: fixed; top: 84px; left: 12px; bottom: 12px; width: 250px; z-index: 900;
    padding: 20px 14px; display: flex; flex-direction: column; overflow-y: auto;
    background: var(--side); border-radius: var(--r); box-shadow: var(--side-shadow);
    transition: transform .3s ease, background .3s;
}
.sidebar::-webkit-scrollbar { width: 0; }
.sb-brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 16px; }
.sb-ico {
    width: 42px; height: 42px; border-radius: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 21px; color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
}
[data-theme="light"] .sb-ico { background: #fff; color: var(--pink); box-shadow: 5px 5px 12px rgba(190,25,95,.3), -3px -3px 8px rgba(255,200,225,.5); }
.sb-name { display: block; font-weight: 800; font-size: 14px; letter-spacing: .14em; color: var(--side-text); }
[data-theme="dark"] .sb-name { color: var(--text); }
.sb-sub { display: block; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; margin-top: 2px; color: var(--side-muted); }
.sb-search {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 16px; border-radius: var(--r);
    background: var(--side); box-shadow: var(--in); color: var(--side-muted);
}
[data-theme="light"] .sb-search { background: rgba(255,255,255,.18); box-shadow: inset 3px 3px 8px rgba(190,25,95,.35), inset -3px -3px 8px rgba(255,190,220,.45); }
.sb-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font: 500 13px 'Poppins', sans-serif; color: var(--side-text); }
[data-theme="dark"] .sb-search input { color: var(--text); }
.sb-search input::placeholder { color: var(--side-muted); }
.sb-search kbd { font: 600 10px 'Poppins', sans-serif; padding: 3px 7px; border-radius: 8px; background: var(--card); box-shadow: var(--out-sm); color: var(--sub); }
.sb-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; margin: 4px 8px 10px; color: var(--side-muted); }
.nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r);
    text-decoration: none; font-size: 13px; font-weight: 500; color: var(--side-text); transition: all .2s; white-space: nowrap;
}
.nav-item i { font-size: 18px; width: 20px; flex-shrink: 0; }
.nav-item:hover { background: var(--side-hover); box-shadow: var(--out-sm); }
[data-theme="dark"] .nav-item:hover { color: var(--pink); }
.nav-item.active { color: #fff; font-weight: 600; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); }
[data-theme="light"] .nav-item.active { background: #fff; color: var(--pink); box-shadow: 6px 6px 14px rgba(190,25,95,.32), -3px -3px 8px rgba(255,200,225,.5); }
.promo { margin-top: 12px; padding: 16px; border-radius: var(--r); background: var(--card); box-shadow: var(--out-sm); }
.promo .rk { font-size: 30px; display: block; margin-bottom: 6px; }
.promo h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
.promo p { font-size: 11px; line-height: 1.5; margin-bottom: 12px; color: var(--muted); }
.promo a {
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 16px; text-decoration: none;
    font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
}
.logout-btn {
    margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r);
    text-decoration: none; font-size: 13px; font-weight: 600; color: #ff6b81; transition: all .2s;
}
[data-theme="light"] .logout-btn { color: #fff; }
.logout-btn:hover { background: var(--side-hover); box-shadow: var(--out-sm); }

.hamburger {
    display: none; position: fixed; top: 80px; left: 14px; z-index: 950; width: 44px; height: 44px; border: 0; cursor: pointer;
    border-radius: 16px; font-size: 22px; align-items: center; justify-content: center; color: var(--pink);
    background: var(--card); box-shadow: var(--out-sm);
}
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 850; }
.sidebar-overlay.show { display: block; }

/* ═════════ MAIN ═════════ */
.main { margin-left: 276px; padding: 30px 36px 60px; min-width: 0; }
.page-top { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
.page-top h4 { font-size: 1.25rem; font-weight: 700; letter-spacing: 2px; color: var(--text); }
.back-btn {
    display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--r); text-decoration: none;
    font-size: .72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--sub);
    background: var(--card); box-shadow: var(--out-sm); transition: all .2s;
}
.back-btn:hover { color: var(--pink); }
.back-btn:active { box-shadow: var(--in); }

/* ═════════ CARDS / BUTTONS / FORM ═════════ */
.card { border-radius: var(--r); background: var(--card); box-shadow: var(--out); margin-bottom: 24px; }
.card-body { padding: 26px; }
.card-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; font-size: .68rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }
.card-title i { color: var(--pink); font-size: 1rem; }
.form-card { max-width: 560px; padding: 36px 32px; border-radius: var(--r); background: var(--card); box-shadow: var(--out); }
.form-card.wide { max-width: 680px; margin-bottom: 34px; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border: 0; cursor: pointer;
    border-radius: var(--r); text-decoration: none; color: #fff; font-size: .74rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn); transition: transform .2s, filter .2s;
}
.btn:hover { filter: brightness(1.06); transform: translateY(-2px); }
.btn:active { transform: none; filter: brightness(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
.btn-block { width: 100%; }
.btn-sm { padding: 9px 16px; font-size: .66rem; letter-spacing: 1.2px; border-radius: 16px; }
.btn-soft { color: var(--sub); background: var(--card); box-shadow: var(--out-sm); }
.btn-soft:hover { color: var(--pink); filter: none; }
.btn-soft:active { box-shadow: var(--in); }
.btn-danger { color: var(--danger); background: var(--card); box-shadow: var(--out-sm); }
.btn-danger:hover { filter: none; }
.btn-danger:active { box-shadow: var(--in); }
.btn-ok { background: linear-gradient(145deg, #5fe0a0, #1f9d5c); box-shadow: 8px 8px 20px rgba(31,157,92,.3), inset -4px -4px 10px rgba(10,100,55,.45), inset 4px 4px 10px rgba(160,255,205,.5); }
.btn-wa { background: linear-gradient(145deg, #3fe27c, #139a4a); box-shadow: 8px 8px 20px rgba(19,154,74,.3), inset -4px -4px 10px rgba(8,100,45,.45), inset 4px 4px 10px rgba(170,255,200,.5); }
.btn-submit { width: 100%; margin-top: 8px; padding: 15px; font-size: .8rem; letter-spacing: 3px; }

.alert {
    display: flex; align-items: center; gap: 8px; margin-bottom: 18px; padding: 12px 14px; border-radius: var(--r);
    font-size: 14px; color: var(--danger); background: var(--field); box-shadow: var(--in);
}
.alert.ok { color: var(--ok); }

.field { margin-bottom: 20px; }
.field label { display: block; margin-bottom: 8px; font-size: .68rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }
.field label span { color: var(--pink); margin-left: 2px; }
.input-wrap { position: relative; }
.input-wrap > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--muted); pointer-events: none; transition: color .3s; z-index: 1; }
.input-wrap.top > i { top: 18px; transform: none; }
.input-wrap:focus-within > i { color: var(--pink); }
.field input, .field textarea {
    width: 100%; padding: 14px 16px 14px 44px; border: 0; outline: 0; border-radius: var(--r);
    background: var(--field); box-shadow: var(--in); color: var(--text); font-size: .88rem; font-weight: 500; transition: box-shadow .25s;
}
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); }
.field input:focus, .field textarea:focus { box-shadow: var(--in), 0 0 0 2px var(--pink); }
.field input[readonly] { color: var(--muted); cursor: not-allowed; }
.field input[readonly]:focus { box-shadow: var(--in); }
.field-hint { margin-top: 6px; font-size: .7rem; line-height: 1.5; letter-spacing: .3px; color: var(--muted); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.section-sep { display: flex; align-items: center; gap: 12px; margin: 28px 0 22px; }
.sep-line { flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
.sep-label { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: .65rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--pink); }

.badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 14px; background: var(--field); box-shadow: var(--in);
    font-size: .62rem; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--pink);
}
.badge-active { color: var(--ok); }
.badge-inactive { color: var(--danger); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state i { display: block; margin-bottom: 14px; font-size: 2.6rem; color: var(--pink); opacity: .5; }
.empty-state p { font-size: .8rem; letter-spacing: 1.5px; }

/* ═════════ PACKAGES ═════════ */
.pkg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
.pkg-card { padding: 24px 22px; border-radius: var(--r); background: var(--card); box-shadow: var(--out); transition: transform .25s; }
.pkg-card:hover { transform: translateY(-3px); }
.pkg-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.pkg-name { font-size: 1rem; font-weight: 700; letter-spacing: 1.5px; color: var(--pink); }
.pkg-desc { min-height: 40px; margin-bottom: 14px; font-size: .82rem; line-height: 1.6; color: var(--sub); }
.pkg-price { margin-bottom: 18px; font-size: 1.5rem; font-weight: 700; color: var(--text); }
.pkg-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }

/* ═════════ PROFILE ═════════ */
.avatar-wrap { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
.avatar {
    width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; color: #fff; text-transform: uppercase;
    background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
}
.avatar-info h3 { font-size: .95rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text); margin-bottom: 4px; }
.avatar-info p { font-size: .7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* ═════════ SEND LINK ═════════ */
.narrow { max-width: 600px; }
.client-eyebrow { font-size: .68rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.client-name { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; font-size: 1.35rem; font-weight: 700; color: var(--pink); }
.link-row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 8px; }
.link-box { flex: 1; min-width: 0; padding: 14px 16px; border-radius: var(--r); background: var(--field); box-shadow: var(--in); font-size: .82rem; line-height: 1.5; word-break: break-all; color: var(--sub); }
.btn-copy.copied { color: #fff; background: linear-gradient(145deg, #5fe0a0, #1f9d5c); }
.insta-box { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--r); background: var(--card); box-shadow: var(--out-sm); }
.insta-ico {
    width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
.insta-text { flex: 1; min-width: 0; }
.insta-text p { font-size: .82rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.insta-text span { font-size: .72rem; color: var(--muted); }

/* ═════════ CLIENT CARD / STATUS ═════════ */
.client-card { display: flex; align-items: center; gap: 14px; padding: 16px 20px; margin-bottom: 24px; border-radius: var(--r); background: var(--card); box-shadow: var(--out-sm); }
.client-avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
    background: linear-gradient(145deg, var(--pink-2), var(--pink-deep)); box-shadow: var(--btn);
}
.client-card .client-name { margin: 0; font-size: 1rem; }
.client-meta { font-size: .75rem; color: var(--muted); margin-top: 3px; }
.status-badge { margin-left: auto; text-transform: capitalize; }

/* ═════════ UPLOAD ═════════ */
.drop-zone {
    padding: 48px 24px; text-align: center; cursor: pointer; user-select: none; border-radius: var(--r);
    background: var(--field); box-shadow: var(--in); transition: box-shadow .25s;
}
.drop-zone:hover, .drop-zone.drag-over { box-shadow: var(--in), 0 0 0 2px var(--pink); }
.drop-zone.limit-blocked { box-shadow: var(--in), 0 0 0 2px var(--danger); }
.drop-icon { font-size: 40px; color: var(--pink); margin-bottom: 12px; }
.drop-title { font-size: .9rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.drop-hint { font-size: .72rem; color: var(--muted); line-height: 1.5; }

.preview-bar { display: none; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 14px; border-radius: var(--r); background: var(--field); box-shadow: var(--in); }
.count-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--pink); }
.icon-btn {
    width: 38px; height: 38px; border: 0; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--danger); background: var(--card); box-shadow: var(--out-sm);
}
.icon-btn:active { box-shadow: var(--in); }
.icon-btn:disabled { opacity: .5; cursor: not-allowed; }
.preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-top: 16px; }

    <div class="gal-head">
        <div>
            <h5 th:text="${client.coupleName} + ' — Your Gallery'">Couple Name — Your Gallery</h5>
            <small>Select your favourite photos</small>
        </div>
        <div class="selection-pill">
            <i class="ti ti-heart"></i>
            <span><span id="selectionCount" th:text="${selectionCount}">0</span> selected</span>
        </div>
    </div>

    <div th:each="album : ${albums}">

        <!-- SELECTED PHOTOS -->
        <div th:if="${!selectedPhotos[album.id].isEmpty()}">
            <div class="album-header selected-header">
                <i class="ti ti-circle-check"></i>
                <h6 th:text="${album.title} + ' — Selected'">Album — Selected</h6>
            </div>
            <div class="photo-grid">
                <div class="photo-card selected-card"
                     th:each="photo : ${selectedPhotos[album.id]}"
                     th:id="'card-' + ${photo.id}">
                    <div class="selected-tick"><i class="ti ti-check"></i></div>
                    <img th:src="@{/gallery/photo/__${photo.id}__}"
                         th:alt="${photo.filename}"
                         th:data-full="@{/gallery/photo/__${photo.id}__}"
                         onclick="openLightbox(this)"
                         onerror="this.src='/images/placeholder.jpg'">
                    <div class="card-footer">
                        <button class="select-btn btn-deselect"
                                th:id="'badge-' + ${photo.id}"
                                th:onclick="'togglePhoto(' + ${photo.id} + ', false, this)'">
                            <i class="ti ti-x" style="font-size:0.75rem;vertical-align:-1px;margin-right:3px"></i>Remove
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- UNSELECTED PHOTOS -->
        <div th:if="${!unselectedPhotos[album.id].isEmpty()}">
            <div class="album-header unselected-header">
                <i class="ti ti-folder"></i>
                <h6 th:text="${album.title}">Album Title</h6>
            </div>
            <div class="photo-grid">
                <div class="photo-card"
                     th:each="photo : ${unselectedPhotos[album.id]}"
                     th:id="'card-' + ${photo.id}">
                    <div class="selected-tick"><i class="ti ti-check"></i></div>
                    <img th:src="@{/gallery/photo/__${photo.id}__}"
                         th:alt="${photo.filename}"
                         th:data-full="@{/gallery/photo/__${photo.id}__}"
                         onclick="openLightbox(this)"
                         onerror="this.src='/images/placeholder.jpg'">
                    <div class="card-footer">
                        <button class="select-btn btn-select"
                                th:id="'badge-' + ${photo.id}"
                                th:onclick="'togglePhoto(' + ${photo.id} + ', true, this)'">
                            <i class="ti ti-heart" style="font-size:0.75rem;vertical-align:-1px;margin-right:3px"></i>Select
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- SUBMIT BAR -->
<div class="submit-bar">
    <div class="submit-info"><strong id="submitCount" th:text="${selectionCount}">0</strong> photos selected</div>
    <form th:action="@{/gallery/submit}" method="post">
        <button type="submit" class="btn">
            <i class="ti ti-send"></i> Submit
        </button>
    </form>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightboxOutside(event)">
    <button class="lb-close" onclick="closeLightbox()"><i class="ti ti-x"></i></button>
    <button type="button" class="lb-heart" id="lbHeart" onclick="toggleFromLightbox(event)" aria-label="Select this photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </button>
    <span class="lb-heart-label" id="lbHeartLabel">Select</span>
    <div class="lb-toast" id="lbToast"></div>
    <button class="lb-nav lb-prev" onclick="changePhoto(-1)"><i class="ti ti-chevron-left"></i></button>
    <img id="lightbox-img" src="" alt="">
    <button class="lb-nav lb-next" onclick="changePhoto(1)"><i class="ti ti-chevron-right"></i></button>
    <div class="lb-counter" id="lightbox-counter"></div>
    <div class="lb-watermark">© Saara Photography — Personal Use Only</div>
</div>

<script>
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
}

(function () {
    var root = document.documentElement;

    // theme toggle (saved as saara-theme)
    var themeBtn = document.getElementById('ssTheme');
    if (themeBtn) themeBtn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('saara-theme', next); } catch (e) {}
    });

    // top nav burger + active link
    var b = document.getElementById('ssBurger'), l = document.getElementById('ssLinks');
    if (b && l) b.addEventListener('click', function () {
        var o = l.classList.toggle('open');
        b.setAttribute('aria-expanded', o ? 'true' : 'false');
    });
    var p = location.pathname.replace(/\/+$/, '') || '/';
    if (l) l.querySelectorAll('a').forEach(function (a) { if (a.getAttribute('href') === p) a.classList.add('on'); });

    // sidebar search + Ctrl/Cmd+K + Esc
    var s = document.getElementById('navSearch');
    if (s) s.addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        document.querySelectorAll('#navList a').forEach(function (a) {
            a.style.display = (!q || a.textContent.toLowerCase().indexOf(q) > -1) ? '' : 'none';
        });
    });
    document.addEventListener('keydown', function (e) {
        if (s && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); s.focus(); }
        var sb = document.getElementById('sidebar');
        if (e.key === 'Escape' && sb && sb.classList.contains('open')) toggleSidebar();
    });

    // ripple + pop, then go to the page
    function bind(sel) {
        document.querySelectorAll(sel).forEach(function (a) {
            a.addEventListener('click', function (e) {
                var href = a.getAttribute('href');
                var r = a.getBoundingClientRect();
                var d = Math.max(r.width, r.height) * 1.6;
                var sp = document.createElement('span');
                sp.className = 'ripple';
                sp.style.width = sp.style.height = d + 'px';
                sp.style.left = (e.clientX - r.left - d / 2) + 'px';
                sp.style.top = (e.clientY - r.top - d / 2) + 'px';
                a.appendChild(sp);
                a.classList.remove('pop'); void a.offsetWidth; a.classList.add('pop');
                setTimeout(function () { sp.remove(); a.classList.remove('pop'); }, 600);
                if (!href || href.charAt(0) === '#' || a.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
                e.preventDefault();
                setTimeout(function () { location.href = href; }, 260);
            });
        });
    }
    bind('#navList a'); bind('.promo a'); bind('.ss-links a');
})();

</script>
<script src="/js/constants.js"></script>
<script>
/* ══════════ PROTECTION LAYER ══════════ */
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
    const blocked =
        e.key === 'PrintScreen' ||
        (e.ctrlKey && ['s','p','u','a'].includes(e.key.toLowerCase())) ||
        e.key === 'F12' ||
        (e.metaKey && ['s','p'].includes(e.key.toLowerCase()));
    if (blocked) {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === 'PrintScreen') flashBlock(600);
    }
    if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'ArrowRight') changePhoto(1);
        if (e.key === 'ArrowLeft') changePhoto(-1);
        if (e.key === 'Escape') closeLightbox();
    }
});

document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

function flashBlock(ms = 600) {
    document.body.classList.add('ss-block');
    document.getElementById('ss-protect').style.display = 'block';
    setTimeout(() => {
        document.body.classList.remove('ss-block');
        document.getElementById('ss-protect').style.display = 'none';
    }, ms);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flashBlock(800); });
window.addEventListener('blur', () => { flashBlock(700); });

document.addEventListener('keydown', e => {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) ||
        (e.metaKey && e.altKey && ['i','j','c'].includes(e.key.toLowerCase()))) {
        e.preventDefault();
    }
});

/* ══════════ GALLERY LOGIC ══════════ */
const csrfToken = '';
const csrfHeader = 'X-CSRF-TOKEN';

function togglePhoto(photoId, select, btn) {
    const url = select ? `/gallery/select/${photoId}` : `/gallery/deselect/${photoId}`;
    btn.disabled = true;
    return fetch(url, { method: 'POST', headers: { [csrfHeader]: csrfToken } })
    .then(res => res.json())
    .then(data => {
        document.getElementById('selectionCount').textContent = data.count;
        document.getElementById('submitCount').textContent = data.count;
        const card = document.getElementById('card-' + photoId);
        if (select) {
            card.classList.add('selected-card');
            btn.innerHTML = '<i class="ti ti-x" style="font-size:0.75rem;vertical-align:-1px;margin-right:3px"></i>Remove';
            btn.classList.remove('btn-select'); btn.classList.add('btn-deselect');
            btn.onclick = function() { togglePhoto(photoId, false, btn); };
        } else {
            card.classList.remove('selected-card');
            btn.innerHTML = '<i class="ti ti-heart" style="font-size:0.75rem;vertical-align:-1px;margin-right:3px"></i>Select';
            btn.classList.remove('btn-deselect'); btn.classList.add('btn-select');
            btn.onclick = function() { togglePhoto(photoId, true, btn); };
        }
        btn.disabled = false;
        syncHeart();
    })
    .catch(() => { btn.disabled = false; syncHeart(); });
}

let allPhotos = [], currentIndex = 0;
document.addEventListener('DOMContentLoaded', () => {
    allPhotos = Array.from(document.querySelectorAll('.photo-grid img'));
});

function currentCard() {
    const img = allPhotos[currentIndex];
    return img ? img.closest('.photo-card') : null;
}

function syncHeart() {
    const heart = document.getElementById('lbHeart');
    const label = document.getElementById('lbHeartLabel');
    const card = currentCard();
    if (!heart || !card) return;
    const selected = card.classList.contains('selected-card');
    heart.classList.toggle('selected', selected);
    heart.setAttribute('aria-label', selected ? 'Remove from selected' : 'Select this photo');
    label.textContent = selected ? 'Selected' : 'Select';
}

function showLbToast(msg) {
    const t = document.getElementById('lbToast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showLbToast._t);
    showLbToast._t = setTimeout(() => t.classList.remove('show'), 1400);
}

function toggleFromLightbox(e) {
    if (e) e.stopPropagation();
    const card = currentCard();
    if (!card) return;
    const heart = document.getElementById('lbHeart');
    const photoId = card.id.replace('card-', '');
    const btn = document.getElementById('badge-' + photoId);
    if (!btn || btn.disabled) return;
    const willSelect = !card.classList.contains('selected-card');
    heart.disabled = true;
    const p = togglePhoto(photoId, willSelect, btn);
    Promise.resolve(p).finally(() => {
        heart.disabled = false;
        syncHeart();
        heart.classList.remove('pop');
        void heart.offsetWidth;
        heart.classList.add('pop');
        showLbToast(card.classList.contains('selected-card') ? '♥ Added to selected' : 'Removed from selected');
    });
}

function openLightbox(imgEl) {
    currentIndex = allPhotos.indexOf(imgEl);
    showPhoto(currentIndex);
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
    try {
        const lb = document.getElementById('lightbox');
        if (lb.requestFullscreen && !document.fullscreenElement) {
            const r = lb.requestFullscreen();
            if (r && r.catch) r.catch(() => {});
        }
    } catch (err) {}
}
function showPhoto(idx) {
    const img = allPhotos[idx];
    document.getElementById('lightbox-img').src = img.dataset.full || img.src;
    document.getElementById('lightbox-counter').textContent = (idx + 1) + ' / ' + allPhotos.length;
    syncHeart();
}
function changePhoto(dir) {
    currentIndex = (currentIndex + dir + allPhotos.length) % allPhotos.length;
    showPhoto(currentIndex);
}
function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
    try {
        if (document.fullscreenElement && document.exitFullscreen) {
            const r = document.exitFullscreen();
            if (r && r.catch) r.catch(() => {});
        }
    } catch (err) {}
}
function closeLightboxOutside(e) {
    if (e.target.id !== 'lightbox') return;
    const r = document.getElementById('lightbox-img').getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right &&
                   e.clientY >= r.top  && e.clientY <= r.bottom;
    if (!inside) closeLightbox();
}
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }
});
(function() {
    let sx = 0, sy = 0;
    const lb = document.getElementById('lightbox');
    lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    lb.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) changePhoto(dx < 0 ? 1 : -1);
    }, { passive: true });
})();

// Replace history so the login page never appears on Back press.
(function() {
    if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', '/gallery/view');
    }
})();
</script>
