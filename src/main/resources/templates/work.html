<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Saara Photography</title>
<script>(function(){try{var t=localStorage.getItem('saara-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap">
<style>
/* ============ CLAYMORPHISM · dark / light (nav pink in light, center white) ============ */
:root,html[data-theme="dark"]{
 --k-pink:#ff4d94;--k-pink2:#ff7ab3;--k-deep:#d92a76;
 --k-bg:#0c0809;--k-bar:#17101a;--k-card:#1c1420;--k-field:#150e18;
 --k-text:#fbeef4;--k-sub:#c9aebb;--k-muted:#8a7280;--k-line:rgba(255,255,255,.08);
 --k-bartext:#c9aebb;--k-barhover:#1c1420;
 --k-out:10px 10px 24px rgba(0,0,0,.65),-6px -6px 16px rgba(255,255,255,.045);
 --k-outsm:6px 6px 14px rgba(0,0,0,.6),-4px -4px 10px rgba(255,255,255,.04);
 --k-in:inset 4px 4px 10px rgba(0,0,0,.6),inset -3px -3px 8px rgba(255,255,255,.04);
 --k-btn:8px 8px 20px rgba(255,77,148,.32),inset -4px -4px 10px rgba(180,20,90,.55),inset 4px 4px 10px rgba(255,160,205,.55);
 --k-barshadow:var(--k-out);--k-glowa:rgba(255,77,148,.14);--k-glowb:rgba(255,77,148,.10);
}
html[data-theme="light"]{
 --k-pink:#ff3d8b;
 --k-bg:#ffffff;
 --k-bar:linear-gradient(165deg,#ff8fc0 0%,#ff4d94 55%,#e0307a 100%);
 --k-card:#ffffff;--k-field:#fff3f8;
 --k-text:#3b1d2c;--k-sub:#7d5568;--k-muted:#b48a9c;--k-line:rgba(255,61,139,.14);
 --k-bartext:#ffffff;--k-barhover:rgba(255,255,255,.22);
 --k-out:10px 10px 26px rgba(214,120,160,.30),-8px -8px 20px rgba(255,255,255,.95);
 --k-outsm:6px 6px 14px rgba(214,120,160,.26),-5px -5px 12px rgba(255,255,255,.95);
 --k-in:inset 4px 4px 10px rgba(214,120,160,.22),inset -4px -4px 10px rgba(255,255,255,.95);
 --k-btn:8px 8px 20px rgba(255,61,139,.34),inset -4px -4px 10px rgba(200,30,100,.45),inset 4px 4px 10px rgba(255,170,210,.7);
 --k-barshadow:12px 12px 28px rgba(255,61,139,.35),inset -5px -5px 12px rgba(190,25,95,.35),inset 5px 5px 12px rgba(255,190,220,.55);
 --k-glowa:rgba(255,61,139,.06);--k-glowb:rgba(255,61,139,.05);
}
:root{--k-r:20px}

/* ============ TOP NAV (same on every page) ============ */
.ss-nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 24px));height:58px;z-index:2147483000;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;
 border-radius:var(--k-r);background:var(--k-bar);box-shadow:var(--k-barshadow);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box}
.ss-nav *{box-sizing:border-box}
html body .ss-nav a.ss-brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0;overflow:hidden;color:var(--k-text)!important}
html[data-theme="light"] body .ss-nav a.ss-brand{color:#fff!important}
.ss-logo{position:relative;width:34px;height:34px;border-radius:12px;overflow:hidden;flex-shrink:0;display:block}
.ss-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0!important;opacity:1!important;filter:none!important;box-shadow:none!important;transform:none!important}
.ss-bt{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-links{display:flex;align-items:center;gap:6px}
html body .ss-nav .ss-links a{position:relative;overflow:hidden;padding:9px 14px;border-radius:16px;text-decoration:none;white-space:nowrap;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
 color:var(--k-bartext)!important;background:transparent!important;border:0!important;box-shadow:none!important;transition:all .2s;transform:none!important;opacity:1!important}
html body .ss-nav .ss-links a:hover{color:var(--k-pink)!important;background:var(--k-barhover)!important}
html[data-theme="light"] body .ss-nav .ss-links a:hover{color:#fff!important}
html body .ss-nav .ss-links a.on{color:#fff!important;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important}
html[data-theme="light"] body .ss-nav .ss-links a.on{color:var(--k-pink)!important;background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}
html body .ss-nav a.ss-cta{padding:10px 16px;border-radius:16px;text-decoration:none;white-space:nowrap;color:#fff!important;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
 background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important;border:0!important}
html[data-theme="light"] body .ss-nav a.ss-cta{color:var(--k-pink)!important;background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}
html body .ss-nav .ss-ic{width:40px!important;height:40px!important;border-radius:15px!important;border:0!important;cursor:pointer;padding:0!important;flex-shrink:0;display:flex!important;align-items:center;justify-content:center;
 color:var(--k-pink)!important;background:var(--k-card)!important;box-shadow:var(--k-outsm)!important;position:static!important;transform:none!important;filter:none!important}
html[data-theme="light"] body .ss-nav .ss-ic{background:#fff!important;box-shadow:5px 5px 12px rgba(190,25,95,.3),-3px -3px 8px rgba(255,200,225,.5)!important}
.ss-ic svg{width:19px;height:19px}
html[data-theme="dark"] .ss-moon,html[data-theme="light"] .ss-sun{display:none!important}
html body .ss-nav .ss-burger{display:none!important}
html body a.ss-ig{position:fixed!important;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:20px;display:flex!important;align-items:center;justify-content:center;z-index:2147482000;
 text-decoration:none;color:#fff!important;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep))!important;box-shadow:var(--k-btn)!important;transition:transform .2s;border:0!important;opacity:1!important}
html body a.ss-ig svg{width:25px;height:25px}
html body a.ss-ig:hover{transform:translateY(-3px)}
html body a.ss-ig:active{transform:scale(.95)}
.ss-ripple{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);background:rgba(255,77,148,.35);animation:ssRip .6s ease-out forwards}
html[data-theme="light"] .ss-ripple{background:rgba(255,255,255,.55)}
html[data-theme="light"] .ss-links a.on .ss-ripple{background:rgba(255,61,139,.3)}
@keyframes ssRip{to{transform:scale(1);opacity:0}}
@keyframes ssPop{0%{transform:scale(1)}40%{transform:scale(.94)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
html body .ss-links a.pop{animation:ssPop .35s ease!important}
@media(max-width:900px){
 html body .ss-nav a.ss-cta{display:none}
 html body .ss-nav .ss-burger{display:flex!important}
 html body .ss-nav .ss-links{position:absolute;top:66px;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;padding:12px;border-radius:var(--k-r);background:var(--k-bar);box-shadow:var(--k-barshadow);display:none}
 html body .ss-nav .ss-links.open{display:flex}
 html body .ss-nav .ss-links a{padding:13px 16px;font-size:12px}
}
@media(max-width:480px){
 html body a.ss-ig{right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:18px}
 .ss-bt{font-size:11.5px;letter-spacing:.08em}
 html[data-theme] body{padding-top:84px!important}
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{min-height:100%;width:100%;background:var(--k-bg);scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--k-text);min-height:100vh;width:100%;overflow-x:hidden;padding:84px 0 70px;background:radial-gradient(600px 420px at 90% -5%,var(--k-glowa),transparent 70%),radial-gradient(560px 420px at 5% 105%,var(--k-glowb),transparent 70%),var(--k-bg);background-attachment:fixed;transition:background .3s,color .3s}
body.lock{overflow:hidden}

/* HERO */
.hero{text-align:center;padding:26px 10px 15px;position:relative;z-index:5}
.hero img{width:82px;height:82px;object-fit:cover;border-radius:var(--k-r);box-shadow:var(--k-out);margin-bottom:16px;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.hero small{display:block;font-size:11px;font-weight:600;letter-spacing:7px;text-transform:uppercase;color:var(--k-pink);margin-bottom:10px}
.hero p{color:var(--k-sub);font-size:13px;margin-top:10px;letter-spacing:.5px}

/* FLOATING 3D PHOTO REEL (no rope) */
.pond{position:relative;width:100%;margin:6px auto 0;overflow:visible}
.reel{--d:clamp(150px,24vw,240px);display:flex;align-items:flex-start;gap:clamp(22px,4vw,46px);overflow-x:auto;overflow-y:visible;
 padding:34px calc(50% - var(--d)/2) 84px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.reel::-webkit-scrollbar{display:none}
.reel.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.hang{position:relative;flex:0 0 var(--d);width:var(--d);height:var(--d);scroll-snap-align:center;
 transform:perspective(1000px) rotateY(var(--ry,0deg)) scale(var(--sc,1));opacity:var(--op,1);transition:transform .2s ease-out,opacity .2s;
 animation:bob var(--sw,4s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes bob{from{translate:0 -7px}to{translate:0 7px}}
.item{position:absolute;left:0;top:0;width:100%;height:100%;padding:0;border:0;background:none;border-radius:18px;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.rnav{position:absolute;top:calc(34px + clamp(150px,24vw,240px)/2 - 21px);z-index:6;width:42px;height:42px;border:0;border-radius:15px;cursor:pointer;display:grid;place-items:center;font-size:18px;color:#fff;
 background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));box-shadow:var(--k-btn)}
.rnav.l{left:12px}.rnav.r{right:12px}
.rnav:active{transform:scale(.94)}
@media(max-width:600px){.rnav{display:none}}

/* SQUARE MULTI-PHOTO STACK (front photo + two photos behind it) */
.medal{position:absolute;inset:0;z-index:2;border-radius:18px;overflow:hidden;border:4px solid var(--k-card);background:var(--k-field) var(--cover) center/cover no-repeat;
 box-shadow:var(--k-out),0 0 0 3px var(--k-pink);transition:transform .6s ease,box-shadow .6s}
.medal::after{content:"";position:absolute;inset:0;border-radius:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.28),transparent 35%,transparent 65%,rgba(0,0,0,.18))}
.stk{position:absolute;inset:0;z-index:1;border-radius:18px;border:4px solid var(--k-card);background:var(--k-field) var(--c) center/cover no-repeat;box-shadow:var(--k-outsm);transition:transform .6s ease}
.stk.s1{transform:rotate(-8deg) translate(-7px,3px)}
.stk.s2{transform:rotate(7deg) translate(7px,1px)}
.item:hover .stk.s1,.item:focus-visible .stk.s1,.hang.active .stk.s1{transform:rotate(-14deg) translate(-14px,4px)}
.item:hover .stk.s2,.item:focus-visible .stk.s2,.hang.active .stk.s2{transform:rotate(13deg) translate(14px,2px)}
.item:hover .medal,.item:focus-visible .medal{transform:scale(1.06)}
.item:active .medal{transform:scale(.95)}
.hang.active .medal{transform:scale(1.08);box-shadow:var(--k-out),0 0 0 3px var(--k-pink),0 0 34px rgba(255,77,148,.6)}
.tag{position:absolute;left:50%;top:calc(100% + 16px);transform:translateX(-50%);white-space:nowrap;text-align:center;background:var(--k-card);color:var(--k-text);border-radius:16px;padding:7px 14px;box-shadow:var(--k-outsm);transition:box-shadow .5s;z-index:3}
.tag b{display:block;font-weight:700;font-size:13px;color:var(--k-pink)}
.tag em{display:block;font-style:normal;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--k-muted);margin-top:2px}
.hang.active .tag{box-shadow:var(--k-outsm),0 0 0 2px var(--k-pink)}
.empty{text-align:center;padding:60px 0;color:var(--k-muted)}

/* SAME PAGE PHOTO PANEL */
.panel{display:grid;grid-template-rows:0fr;width:calc(100% - 32px);max-width:1560px;margin:0 auto;opacity:0;transform:translateY(50px);transform-origin:50% 0;scroll-margin-top:84px;
 transition:grid-template-rows .9s ease,opacity .7s ease,transform .9s ease,margin .9s ease}
.panel.open{grid-template-rows:1fr;opacity:1;transform:none;margin:25px auto 35px}
.panel-in{min-height:0;overflow:hidden;padding:8px 6px 14px;margin:-8px -6px -14px}
.panel-card{width:100%;border-radius:var(--k-r);background:var(--k-card);padding:10px 3% 35px;box-shadow:var(--k-out)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 4px 14px;margin-bottom:22px;border-bottom:3px solid var(--k-line)}
.panel-head h2{font-weight:700;font-size:clamp(1.3rem,4.2vw,1.9rem);color:var(--k-pink)}
.close{width:42px;height:42px;border:0;border-radius:15px;cursor:pointer;display:grid;place-items:center;font-size:18px;color:var(--k-pink);background:var(--k-card);box-shadow:var(--k-outsm);transition:transform .4s}
.close:hover{transform:rotate(90deg)}
.close:active{box-shadow:var(--k-in)}
.panel-body{transition:opacity .28s ease}
.panel-body.swap{opacity:0}

/* PHOTO SLIDES */
.slides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:26px;width:94%;max-width:1500px;margin:0 auto;padding:8px 0}
.slide{position:relative;border-radius:var(--k-r);overflow:hidden;background:var(--k-card);box-shadow:var(--k-out)}
.track{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--k-field)}
.sl{position:absolute;inset:0;opacity:0;pointer-events:none;cursor:pointer;z-index:1;transition:opacity 1s ease,transform 1s cubic-bezier(.22,.61,.36,1),filter 1s ease,clip-path 1s cubic-bezier(.65,0,.25,1)}
.sl img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.slide[data-fx="slide"] .sl{transform:translateX(100%)}
.slide[data-fx="slide"] .sl.before{transform:translateX(-100%)}
.slide[data-fx="zoom"] .sl{transform:scale(1.5)}
.slide[data-fx="flip"] .track{perspective:1100px}
.slide[data-fx="flip"] .sl{transform:rotateY(90deg)}
.slide[data-fx="flip"] .sl.before{transform:rotateY(-90deg)}
.slide[data-fx="blur"] .sl{filter:blur(22px);transform:scale(1.12)}
.slide[data-fx="wipe"] .sl{opacity:1;clip-path:inset(0 0 0 100%)}
.slide[data-fx="wipe"] .sl.before{clip-path:inset(0 100% 0 0)}
.slide .sl.on{opacity:1;transform:none;filter:none;clip-path:inset(0);pointer-events:auto;z-index:2}
.slide .nv{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:15px;color:#fff;font-size:23px;line-height:1;cursor:pointer;z-index:6;
 background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));box-shadow:var(--k-btn);transition:transform .3s}
.slide .nv:hover{transform:translateY(-50%) scale(1.08)}
.slide .nv.prev{left:10px}.slide .nv.next{right:10px}
.slide .badge{position:absolute;top:10px;right:10px;background:var(--k-card);color:var(--k-pink);font-size:.7rem;font-weight:600;letter-spacing:1px;padding:5px 11px;border-radius:12px;z-index:6;box-shadow:var(--k-outsm)}
.slide .scap{position:absolute;left:0;right:0;bottom:0;padding:35px 10px 14px;background:linear-gradient(to top,rgba(150,15,75,.92),transparent);color:#fff;font-size:.78rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-align:center;pointer-events:none;z-index:5}
.slide .dots{position:absolute;left:0;right:0;bottom:45px;display:flex;justify-content:center;gap:6px;z-index:6;pointer-events:none}
.slide .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:transform .4s,background .4s}
.slide .dots i.on{background:#fff;transform:scale(1.5)}

.panel.open .slide{animation-duration:1s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.61,.36,1);animation-delay:calc(.45s + var(--i,0)*.12s)}
.panel.open .slide[data-fx="slide"]{animation-name:enSlide}
.panel.open .slide[data-fx="zoom"]{animation-name:enZoom}
.panel.open .slide[data-fx="flip"]{animation-name:enFlip}
.panel.open .slide[data-fx="fade"]{animation-name:enFade}
.panel.open .slide[data-fx="blur"]{animation-name:enBlur}
.panel.open .slide[data-fx="wipe"]{animation-name:enWipe}
@keyframes enSlide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes enZoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes enFlip{from{opacity:0;transform:perspective(900px) rotateX(-70deg)}to{opacity:1;transform:none}}
@keyframes enFade{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes enBlur{from{opacity:0;filter:blur(18px)}to{opacity:1;filter:none}}
@keyframes enWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}

/* FULL SCREEN VIEWER */
.viewer{position:fixed;inset:0;background:rgba(12,6,10,.96);display:none;align-items:center;justify-content:center;z-index:2147483100;flex-direction:column;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:95%;max-height:80vh;object-fit:contain;border-radius:var(--k-r);box-shadow:0 0 40px rgba(255,77,148,.4);-webkit-user-drag:none}
.viewer p{color:#fff;margin-top:14px;letter-spacing:2px;text-transform:uppercase;font-size:.8rem}
.viewer button{position:absolute;color:#fff;border:0;width:44px;height:44px;border-radius:16px;font-size:22px;cursor:pointer;background:linear-gradient(145deg,var(--k-pink2),var(--k-deep));box-shadow:var(--k-btn)}
.viewer #vClose{top:16px;right:16px}
.viewer .vn{top:50%;transform:translateY(-50%)}
.viewer .vn.p{left:12px}.viewer .vn.n{right:12px}

@media(min-width:1200px){.slides{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:769px) and (max-width:1199px){.slides{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:768px){.slides{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:96%}.panel-card{padding:8px 12px 25px}}
@media(max-width:480px){.slides{grid-template-columns:1fr}.hero img{width:74px;height:74px}.panel-head{margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
<link rel="stylesheet" href="/css/saara-nav.css?v=1">
<style id="ss-nav-blur">
/* top nav: slightly blurred + transparent glass (blur sits on a pseudo layer so the mobile menu keeps its own blur) */
html body .ss-nav::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:rgba(14,8,18,.28);
 -webkit-backdrop-filter:blur(8px) saturate(135%);backdrop-filter:blur(8px) saturate(135%);
 border-bottom:1px solid rgba(255,255,255,.07);transition:background .3s}
html[data-theme="light"] body .ss-nav::before{background:rgba(255,255,255,.34);border-bottom:1px solid rgba(255,61,139,.12)}
</style>
<style id="lux-theme">
/* ===== LUXURY EDITORIAL LOOK (fonts + nav type only, original pink colours kept) ===== */
:root{--serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--k-r:6px}
body{font-weight:300;letter-spacing:.01em;-webkit-font-smoothing:antialiased}

/* serif headings */
.panel-head h2,.tag b{font-family:var(--serif)!important}
.panel-head h2{font-weight:500;font-size:clamp(1.8rem,4.6vw,2.6rem);letter-spacing:.02em}
.tag b{font-weight:600;font-size:17px;letter-spacing:.02em}

/* small tracked labels */
.hero small,.tag em,.slide .scap,.slide .badge,.viewer p{font-family:var(--sans);font-weight:500;letter-spacing:.24em}
.hero p{font-weight:300;letter-spacing:.08em}

/* top nav: slim, tracked, serif brand */
html body .ss-nav{font-family:var(--sans)}
html body .ss-nav .ss-bt{font-family:var(--serif);font-weight:500;font-size:1.25rem;letter-spacing:.22em}

<div class="hero">
 <img src="/images/logo.png" alt="Saara Photography logo" onerror="this.remove()">
 <small>Saara Photography</small>
 <p>Swipe &amp; tap a photo stack to explore our photographs</p>
</div>

<!-- ROPE LIGHTING AND PHOTO STACKS -->
<div class="pond" id="pond"></div>

<!-- SAME PAGE PHOTO SECTION -->
<section class="panel" id="panel" aria-hidden="true">
 <div class="panel-in">
  <div class="panel-card">
   <div class="panel-head">
    <h2 id="pTitle"></h2>
    <button type="button" class="close" id="pClose" aria-label="Close"><i class="ti ti-x"></i></button>
   </div>
   <div class="panel-body" id="pBody"></div>
  </div>
 </div>
</section>

<p class="empty" th:if="${sections.isEmpty()}">Photos coming soon.</p>

<!-- HIDDEN THYMELEAF TOPICS -->
<div id="topics" hidden>
 <section class="topic" th:each="st, it : ${sections}" th:id="'topic-' + ${it.index}" th:attr="data-label=${st.label}">
  <div class="slides">
   <div class="slide" th:each="g : ${st.groups}">
    <div class="track">
     <div class="sl" th:each="hp : ${g.photos}" th:attr="data-src=${hp.url},data-title=${hp.title}">
      <img th:src="${hp.url}" th:alt="${hp.title}" loading="lazy" draggable="false">
     </div>
    </div>
    <button type="button" class="nv prev" aria-label="Previous" th:if="${g.count > 1}">&#8249;</button>
    <button type="button" class="nv next" aria-label="Next" th:if="${g.count > 1}">&#8250;</button>
    <span class="badge" th:if="${g.count > 1}" th:text="'1 / ' + ${g.count}">1 / 1</span>
    <div class="dots" th:if="${g.count > 1}"><i th:each="hp : ${g.photos}"></i></div>
    <div class="scap" th:text="${g.title}"></div>
   </div>
  </div>
 </section>
</div>

<!-- FULL SCREEN PHOTO VIEWER -->
<div class="viewer" id="viewer">
 <button type="button" id="vClose" aria-label="Close"><i class="ti ti-x"></i></button>
 <img id="vImg" src="" alt="">
 <button type="button" class="vn p" id="vPrev" aria-label="Previous">&#8249;</button>
 <button type="button" class="vn n" id="vNext" aria-label="Next">&#8250;</button>
 <p id="vTitle"></p>
</div>


<script>
(function(){
var $=function(i){return document.getElementById(i)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

var FX=['slide','zoom','flip','fade','blur','wipe'];
var topics=[].slice.call(document.querySelectorAll('#topics .topic'));
var home=$('topics'),pond=$('pond'),panel=$('panel'),pBody=$('pBody'),pTitle=$('pTitle');
var curT=-1,autoTimer=null,viewerOpen=false;

/* SLIDESHOW SETUP */
topics.forEach(function(t,ti){
 [].slice.call(t.querySelectorAll('.slide')).forEach(function(sl,gi){
  sl.dataset.fx=FX[(gi+ti)%FX.length];
  sl.style.setProperty('--i',gi);
  var items=[].slice.call(sl.querySelectorAll('.sl')),n=items.length,cur=0;
  var badge=sl.querySelector('.badge'),dots=[].slice.call(sl.querySelectorAll('.dots i')),tr=sl.querySelector('.track');
  function show(i){
   if(!n)return;
   cur=(i+n)%n;
   items.forEach(function(el,k){el.classList.toggle('on',k===cur);el.classList.toggle('before',k<cur)});
   if(badge)badge.textContent=(cur+1)+' / '+n;
   dots.forEach(function(d,k){d.classList.toggle('on',k===cur)});
  }
  function manual(d){sl.__hold=Date.now()+7000;show(cur+d)}
  sl.__auto=function(){if(n>1&&Date.now()>(sl.__hold||0))show(cur+1)};
  var pv=sl.querySelector('.prev'),nx=sl.querySelector('.next');
  if(pv)pv.addEventListener('click',function(e){e.stopPropagation();manual(-1)});
  if(nx)nx.addEventListener('click',function(e){e.stopPropagation();manual(1)});
  /* mobile swipe */
  var sx=null;
  tr.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  tr.addEventListener('touchend',function(e){
   if(sx===null)return;
   var dx=e.changedTouches[0].clientX-sx;sx=null;
   if(Math.abs(dx)>40)manual(dx<0?1:-1);
  },{passive:true});
  /* open full screen viewer */
  items.forEach(function(it){it.addEventListener('click',function(){openViewer(items,items.indexOf(it))})});
  show(0);
 });
});

/* FULL SCREEN VIEWER */
var viewer=$('viewer'),vList=[],vI=0;
function vShow(){
 $('vImg').src=vList[vI].dataset.src;
 $('vImg').alt=vList[vI].dataset.title||'Photography';
 $('vTitle').textContent=(vList[vI].dataset.title||'');
 $('vPrev').style.display=$('vNext').style.display=vList.length>1?'':'none';
}
function vStep(d){vI=(vI+d+vList.length)%vList.length;vShow()}
function openViewer(list,i){vList=list;vI=i;vShow();viewer.classList.add('open');viewerOpen=true}
function closeViewer(){viewer.classList.remove('open');viewerOpen=false}
$('vPrev').addEventListener('click',function(e){e.stopPropagation();vStep(-1)});
$('vNext').addEventListener('click',function(e){e.stopPropagation();vStep(1)});
viewer.addEventListener('click',function(e){if(e.target===viewer||e.target.closest('#vClose'))closeViewer()});

/* AUTOMATIC SLIDESHOW */
function startAuto(t){
 var cards=[].slice.call(t.querySelectorAll('.slide')),tick=0;
 clearInterval(autoTimer);
 if(reduce)return;
 autoTimer=setInterval(function(){
  if(document.hidden||viewerOpen)return;
  tick++;
  cards.forEach(function(c,k){if(tick%(3+k%3)===0&&c.__auto)c.__auto()});
 },1200);
}

/* ACTIVE ROPE */
function setActive(i){[].slice.call(pond.querySelectorAll('.hang')).forEach(function(h,k){h.classList.toggle('active',k===i)})}

/* OPEN TOPIC ON SAME PAGE */
function openTopic(i,medal,noScroll){
 if(curT===i){closePanel();return}
 var t=topics[i],wasOpen=curT>=0;
 var r=medal.getBoundingClientRect(),pr=panel.getBoundingClientRect();
 panel.style.setProperty('--ox',(r.left+r.width/2-pr.left)+'px');
 function put(){
  [].slice.call(pBody.children).forEach(function(c){home.appendChild(c)});
  pTitle.textContent=t.dataset.label||'';
  pBody.appendChild(t);
  curT=i;setActive(i);startAuto(t);
 }
 if(wasOpen){
  pBody.classList.add('swap');
  setTimeout(function(){put();pBody.classList.remove('swap')},280);
 }else{
  put();panel.classList.add('open');panel.setAttribute('aria-hidden','false');
 }
 if(!noScroll)setTimeout(function(){panel.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})},wasOpen?360:260);
}

/* CLOSE PANEL */
function closePanel(){
 if(curT<0)return;
 var t=topics[curT];
 panel.classList.remove('open');panel.setAttribute('aria-hidden','true');
 clearInterval(autoTimer);closeViewer();setActive(-1);curT=-1;
 setTimeout(function(){if(curT<0)home.appendChild(t)},1000);
 window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
}
$('pClose').addEventListener('click',closePanel);

/* KEYBOARD */
addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(viewerOpen)closeViewer();else closePanel()}
 else if(viewerOpen){if(e.key==='ArrowLeft')vStep(-1);else if(e.key==='ArrowRight')vStep(1)}
});

/* PHOTO URL -> CSS background value */
function cv(s){return s?'url("'+s.replace(/"/g,'%22')+'")':'none'}

/* 3D TILT BY DISTANCE FROM CENTER */
var reel=null,tiltRaf=0;
function tilt(){
 if(!reel)return;
 var rr=reel.getBoundingClientRect(),mid=rr.left+rr.width/2,half=rr.width/2;
 [].slice.call(reel.children).forEach(function(h){
  var r=h.getBoundingClientRect(),dx=((r.left+r.width/2)-mid)/half;
  var a=Math.min(Math.abs(dx),1.2);
  h.style.setProperty('--ry',(-dx*34).toFixed(1)+'deg');
  h.style.setProperty('--sc',(1-Math.min(a,1)*.22).toFixed(3));
  h.style.setProperty('--op',(1-Math.min(a,1)*.45).toFixed(3));
 });
}
function queueTilt(){if(tiltRaf)return;tiltRaf=requestAnimationFrame(function(){tiltRaf=0;tilt()})}

/* TAP -> STACK MOVES DOWN TO THE PHOTO SECTION, THEN ALL PHOTOS COME */
var flying=false;
function fly(hang,i,it,md){
 if(flying)return;flying=true;
 var r=md.getBoundingClientRect(),sx=window.pageXOffset,sy=window.pageYOffset;
 var f=document.createElement('div');
 f.style.cssText='position:absolute;left:'+(r.left+sx)+'px;top:'+(r.top+sy)+'px;width:'+r.width+'px;height:'+r.height+'px;z-index:2147482500;pointer-events:none;will-change:transform,opacity';
 f.style.setProperty('--cover',getComputedStyle(hang).getPropertyValue('--cover'));
 [].slice.call(it.querySelectorAll('.stk,.medal')).forEach(function(c){f.appendChild(c.cloneNode(true))});
 document.body.appendChild(f);
 hang.style.visibility='hidden';
 /* landing point = just under the rope row, centre of the page (document coords) */
 var tx=sx+window.innerWidth/2,ty=pond.getBoundingClientRect().bottom+sy+25+Math.min(190,r.height*1.1);
 var dx=tx-(r.left+sx+r.width/2),dy=ty-(r.top+sy+r.height/2);
 var anim=f.animate([
  {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:1,offset:0},
  {transform:'translate(0,-16px) rotate(-5deg) scale(1.06)',opacity:1,offset:.16},
  {transform:'translate('+dx+'px,'+dy+'px) rotate(8deg) scale(1.15)',opacity:1,offset:.78},
  {transform:'translate('+dx+'px,'+dy+'px) rotate(0deg) scale(1.6)',opacity:0,offset:1}
 ],{duration:950,easing:'cubic-bezier(.5,0,.5,1)',fill:'forwards'});
 /* photos panel starts opening while the stack is still travelling */
 setTimeout(function(){openTopic(i,md,true)},480);
 anim.onfinish=function(){
  f.remove();hang.style.visibility='';flying=false;
 };
 /* page scrolls down together with the falling stack */
 var y0=sy,y1=Math.max(0,pond.getBoundingClientRect().bottom+sy+25-84),D=1200,T0=null,stop=false;
 function cancel(){stop=true}
 window.addEventListener('wheel',cancel,{once:true,passive:true});
 window.addEventListener('touchstart',cancel,{once:true,passive:true});
 function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
 function stepScroll(ts){
  if(stop)return;
  if(T0===null)T0=ts;
  var p=Math.min(1,(ts-T0)/D);
  window.scrollTo({top:y0+(y1-y0)*ease(p),behavior:'instant'});
  if(p<1)requestAnimationFrame(stepScroll);
 }
 setTimeout(function(){requestAnimationFrame(stepScroll)},120);
}

/* FLOATING PHOTO REEL LAYOUT */
function layout(first){
 var keep=reel?reel.scrollLeft:0;
 pond.innerHTML='';
 var n=topics.length;
 if(!n)return;
 reel=document.createElement('div');reel.className='reel';
 topics.forEach(function(t,i){
  var hang=document.createElement('div');hang.className='hang';
  hang.style.setProperty('--sw',(3.6+(i%4)*.7)+'s');
  hang.style.setProperty('--dl',(-(i*.9))+'s');
  var ims=[].slice.call(t.querySelectorAll('.sl img')).map(function(x){return x.getAttribute('src')});
  if(ims[0])hang.style.setProperty('--cover',cv(ims[0]));
  var it=document.createElement('button');
  it.type='button';it.className='item';
  it.setAttribute('aria-label','Open '+(t.dataset.label||'photos'));
  var md=document.createElement('span');md.className='medal';
  var s1=document.createElement('span'),s2=document.createElement('span');
  s1.className='stk s1';s2.className='stk s2';
  s1.style.setProperty('--c',cv(ims[1]||ims[0]));
  s2.style.setProperty('--c',cv(ims[2]||ims[0]));
  var tg=document.createElement('span');tg.className='tag';
  var nm=document.createElement('b');nm.textContent=t.dataset.label||'';
  tg.appendChild(nm);
  it.appendChild(s1);it.appendChild(s2);it.appendChild(md);it.appendChild(tg);
  hang.appendChild(it);reel.appendChild(hang);
  it.addEventListener('click',function(){
   if(flying)return;
   if(curT===i||reduce){openTopic(i,md);return}
   fly(hang,i,it,md);
  });
 });
 pond.appendChild(reel);

 /* arrows (desktop) */
 var L=document.createElement('button'),R=document.createElement('button');
 L.type=R.type='button';L.className='rnav l';R.className='rnav r';
 L.setAttribute('aria-label','Previous');R.setAttribute('aria-label','Next');
 L.innerHTML='<i class="ti ti-chevron-left"></i>';R.innerHTML='<i class="ti ti-chevron-right"></i>';
 function step(d){var w=reel.children[0].getBoundingClientRect().width+30;reel.scrollBy({left:d*w,behavior:reduce?'auto':'smooth'})}
 L.addEventListener('click',function(){step(-1)});R.addEventListener('click',function(){step(1)});
 pond.appendChild(L);pond.appendChild(R);

 /* mouse drag to scroll (touch scrolls natively) */
 var down=false,moved=false,sx=0,sl=0;
 reel.addEventListener('pointerdown',function(e){
  if(e.pointerType!=='mouse'||e.button)return;
  down=true;moved=false;sx=e.clientX;sl=reel.scrollLeft;
 });
 reel.addEventListener('pointermove',function(e){
  if(!down)return;
  var dx=e.clientX-sx;
  if(Math.abs(dx)>5){moved=true;reel.classList.add('drag')}
  if(moved)reel.scrollLeft=sl-dx;
 });
 function up(){down=false;reel.classList.remove('drag')}
 reel.addEventListener('pointerup',up);reel.addEventListener('pointerleave',up);
 reel.addEventListener('click',function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);

 reel.addEventListener('scroll',queueTilt,{passive:true});
 reel.scrollLeft=keep;
 tilt();
 setActive(curT);
}

/* INITIALIZE */
var lastW=0;
addEventListener('resize',function(){
 var w=pond.clientWidth;
 if(Math.abs(w-lastW)>20){lastW=w;layout(false)}
});
layout(true);
lastW=pond.clientWidth;

/* PHOTO RIGHT CLICK PROTECTION */
document.addEventListener('contextmenu',function(e){
 if(e.target.closest&&e.target.closest('.slide,.viewer'))e.preventDefault();
});
})();
</script>

<script id="top-nav-js">
(function(){
  var root=document.documentElement;
  document.getElementById('ssTheme').addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);root.dataset.theme=n;
    try{localStorage.setItem('saara-theme',n);}catch(e){}
    var tt=document.getElementById('tt');if(tt)tt.textContent=n==='light'?'\u263E':'\u2600';
  });
  var b=document.getElementById('ssBurger'),l=document.getElementById('ssLinks');
  b.addEventListener('click',function(){var o=l.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');});
  var p=location.pathname.replace(/\/+$/,'')||'/';
  l.querySelectorAll('a').forEach(function(a){
    if(a.getAttribute('href')===p)a.classList.add('on');
    a.addEventListener('click',function(e){
      var href=a.getAttribute('href'),r=a.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,s=document.createElement('span');
      s.className='ss-ripple';s.style.width=s.style.height=d+'px';s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
      a.appendChild(s);a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop');
      setTimeout(function(){s.remove();a.classList.remove('pop');},600);
      if(!href||href.charAt(0)==='#'||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
      e.preventDefault();setTimeout(function(){location.href=href;},260);
    });
  });
})();
</script>
<script src="/js/saara-nav.js"></script>
<script>
/* Auto-close mobile menu / admin sidebar when the page is scrolled or tapped outside */
(function(){
  var links=document.getElementById('ssLinks'),burger=document.getElementById('ssBurger'),
      side=document.getElementById('sidebar'),ov=document.getElementById('overlay');
  function isOpen(){return (links&&links.classList.contains('open'))||(side&&side.classList.contains('open'));}
  function closeAll(){
    if(links&&links.classList.contains('open')){links.classList.remove('open');if(burger)burger.setAttribute('aria-expanded','false');}
    if(side&&side.classList.contains('open')){side.classList.remove('open');if(ov)ov.classList.remove('show');}
  }
  function inside(t){return t&&t.closest&&(t.closest('#ssLinks')||t.closest('#ssBurger')||t.closest('#sidebar')||t.closest('.hamburger'));}
  var y0=0;
  function onScroll(e){if(isOpen()&&!inside(e.target)){var y=window.pageYOffset||0;if(Math.abs(y-y0)>4||e.target!==document)closeAll();}}
  window.addEventListener('scroll',onScroll,true);
  window.addEventListener('wheel',function(e){if(isOpen()&&!inside(e.target))closeAll();},{passive:true});
  window.addEventListener('touchstart',function(e){y0=window.pageYOffset||0;if(isOpen()&&!inside(e.target)&&!(ov&&e.target===ov))closeAll();},{passive:true});
  window.addEventListener('touchmove',function(e){if(isOpen()&&!inside(e.target))closeAll();},{passive:true});
  document.addEventListener('click',function(e){if(isOpen()&&!inside(e.target))closeAll();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
})();
</script>
</body>
</html>
